# qwt-full: build the REAL Qubes Windows Tools installer from upstream WiX v4 sources with
# OUR gui-agent fork integrated. PLAN-full-source-build.md steps 2+3; inventory and the
# integration decision in ci-notes/qwt-full-build.md.
#
# What is built from source here: gui-agent.exe + gui-watchdog.exe (our fork), the fork's
# core-agent user-mode tools (qrexec-*, the per-invocation rpc tool exes, wait-for-logon,
# advertise-tools, autologon), the user-mode dependency DLLs (windows-utils, libvchan,
# libxenvchan, qubesdb-client) plus qubesdb-cmd.exe, install-helper.exe, installer.msi and
# the Burn bundle (WiX v4.0.5, upstream sources pinned at v4.2.2-1). Every PE binary we
# build is test-signed with the throwaway cert the guest trusts. Which of them actually
# lands INSIDE the MSI is decided by stage-qwt-repo.ps1's substitution table; the
# deliberate remainder (kernel driver packages, catalog-covered service exes, binaries
# under a recorded hold) is staged bit-identical from the GPG-verified shipped 4.2.2 MSI
# (vendor/qwt-4.2.2/), keeping ITL's Authenticode signatures.
name: qwt-full

on:
  workflow_dispatch:
    inputs:
      fault_injection:
        description: >-
          Build gui-agent with the rank-1 fault injector compiled in (QGA_FAULT_INJECTION=1).
          TEST BUILDS ONLY - the resulting binary can be made to break itself on purpose from
          the registry, so it must never be shipped. Release runs leave this false and the
          code is not compiled at all.
        type: boolean
        default: false
  # Reusable: release-package.yml calls this to get installer.msi + our signed binaries,
  # rather than duplicating 250 lines of toolchain setup that is already proven green.
  workflow_call:
    inputs:
      build_rev:
        description: 'Fourth FILEVERSION field for every binary (the release-package run number)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'agent'
      # core-agent FEEDS the MSI since the substitution-table change: stage-qwt-repo.ps1
      # stages the fork-built qrexec-wrapper.exe and the rpc service definitions/handler
      # scripts from this submodule, and this job builds+signs the rest of the fork's
      # user-mode tool exes so the table can grow to claim them. A submodule bump must
      # rebuild the MSI.
      - 'core-agent'
      - 'vendor/qwt-4.2.2/**'
      - 'packaging/stage-qwt-repo.ps1'
      - 'packaging/patch-xenbus-inf.ps1'
      - '.github/workflows/qwt-full.yml'
      # The user-session helpers are BUILT here and staged into the setup tree's bin\ - a
      # source change to either must rebuild them or the shipped helper goes stale (the
      # silent-drop class: helper built in CI, never reaching the guest).
      - 'tools/notifhost/**'
      - 'tools/wgcbroker/**'

# REPRODUCIBLE BUILDS: /Brepro makes link.exe write a CONTENT HASH into the PE header's
# TimeDateStamp instead of the wall-clock time of the build. Without it the same source
# commit produces a different binary on every run - measured on 2026-08-08, agent commit
# 03b1674c731f built gui-agent.exe as CBBD02069A01E047 once and BDA4615A891BFF3C later.
# That is not cosmetic: it means "same commit" does not imply "same artifact", so a release
# cannot be checked against the build that was actually tested, and a swapped binary would
# be indistinguishable from a rebuild.
# link.exe reads the LINK environment variable and prepends its contents to the command
# line, so setting it here covers every MSBuild/WDK invocation in this workflow without
# editing individual .vcxproj files.
# NOTE: this fixes the dominant cause, not every source of nondeterminism (absolute paths,
# PDB signatures and __DATE__/__TIME__ in sources can still vary). Treat reproducibility as
# verified only once two independent runs of the same commit are compared and match.
env:
  LINK: /Brepro

jobs:
  qwt-full:
    runs-on: windows-2022
    env:
      CONFIG: Release
      # The fourth FILEVERSION field of every OURS binary built here (packaging/version-stamp).
      # A CALL always carries it (the input is required, so a caller that omits it is rejected
      # before any job starts). The only way it is empty is a standalone run of THIS workflow
      # (the push trigger on an agent bump, or a workflow_dispatch fault-injection build) - and
      # that is never a release, so it gets the explicit 0 the overlay contract uses ("not a
      # release", the exact shape the release gates reject). The stamper still throws on UNSET.
      QWTNG_BUILD_REV: ${{ inputs.build_rev || '0' }}
      # Agent-dependency pins — identical to build.yml's gui-agent job (proven).
      WINDOWS_UTILS_REF: v4.2.2
      VCHAN_REF: v4.2.7
      QUBESDB_REF: v4.3.1
      PVDRIVERS_REF: v4.2.0-1
      XENIFACE_SHA: 9cd9a604191bf26da18b564d1686e4ee0ccf3d32
      GUI_COMMON_REF: v4.3.1
      BUILDERV2_REF: main
      # Installer sources: QubesOS/qubes-installer-qubes-os-windows-tools tag v4.2.2-1.
      INSTALLER_SHA: 14c189e44fea99c0b42b029e96f172c7eecec5e0
      # The shipped 4.2.2 MSI we harvest unchanged components from (provenance:
      # vendor/qwt-4.2.2/README.md — extracted from the GPG-verified dom0 RPM).
      STOCK_MSI_SHA256: 7049322128d1cf7d9dc2a48f69ef91a5893a8f779d3b2ad7d25fdfc8eee3baf4
    steps:
      - name: Require signing config
        shell: pwsh
        env:
          HAVE_PFX: ${{ secrets.SIGNING_PFX_B64 != '' }}
        run: |
          if ('${{ vars.SIGNING_ENABLED }}' -ne 'true' -or $env:HAVE_PFX -ne 'true') {
            throw 'qwt-full requires SIGNING_ENABLED=true and SIGNING_PFX_B64/PASS: the MSI embeds our cert as gui-agent-windows sign.crt'
          }

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # FAIL FAST ON SYNTAX. A PowerShell parse error is caught at PARSE time - the script never
      # runs at all - and today one ("$InfPath:" reads as a scope qualifier) was found only after
      # 15 minutes of toolchain setup and compilation, in a step near the end. There is no pwsh in
      # the dev qube to catch it locally, so the build checks it in the first seconds instead.
      - name: Parse-check our PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          $files = Get-ChildItem -Recurse -Filter *.ps1 -Path packaging, guest, tools -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad += "$($f.FullName):$($errs[0].Extent.StartLineNumber): $($errs[0].Message)" }
          }
          Write-Host "parsed $($files.Count) PowerShell files"
          if ($files.Count -lt 10) { throw "only $($files.Count) .ps1 files found - the search path is wrong, this check would pass vacuously" }
          if ($bad) { throw "PowerShell parse errors:`n$($bad -join "`n")" }

      - name: Locate MSBuild and lib.exe
        id: vs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild `
                       -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $vsroot  = & $vswhere -latest -property installationPath
          $tv      = (Get-Content "$vsroot\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $lib     = "$vsroot\VC\Tools\MSVC\$tv\bin\Hostx64\x64\lib.exe"
          if (-not (Test-Path $msbuild)) { throw "MSBuild.exe not found" }
          if (-not (Test-Path $lib)) { throw "lib.exe not found: $lib" }
          "msbuild=$msbuild" | Out-File -Append $env:GITHUB_OUTPUT
          "lib=$lib"         | Out-File -Append $env:GITHUB_OUTPUT

      - name: Fetch sources (agent deps + installer + builderv2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Clone($url, $ref, $dir) {
            git clone --quiet --depth 1 --branch $ref -c advice.detachedHead=false $url $dir
            if ($LASTEXITCODE -ne 0) { throw "clone failed: $url @ $ref" }
          }
          Clone https://github.com/QubesOS/qubes-windows-utils.git             $env:WINDOWS_UTILS_REF deps-src/windows-utils
          Clone https://github.com/QubesOS/qubes-core-vchan-xen.git            $env:VCHAN_REF         deps-src/core-vchan-xen
          Clone https://github.com/QubesOS/qubes-core-qubesdb.git              $env:QUBESDB_REF       deps-src/core-qubesdb
          Clone https://github.com/QubesOS/qubes-gui-common.git                $env:GUI_COMMON_REF    deps-src/gui-common
          Clone https://github.com/QubesOS/qubes-vmm-xen-windows-pvdrivers.git $env:PVDRIVERS_REF     deps-src/pvdrivers
          Clone https://github.com/QubesOS/qubes-builderv2.git                 $env:BUILDERV2_REF     deps-src/builderv2
          git clone --quiet --no-checkout https://xenbits.xen.org/git-http/pvdrivers/win/xeniface.git deps-src/pvdrivers/xeniface
          if ($LASTEXITCODE -ne 0) { throw "xeniface clone failed" }
          git -C deps-src/pvdrivers/xeniface fetch --quiet --depth 1 origin $env:XENIFACE_SHA
          if ($LASTEXITCODE -ne 0) { throw "xeniface fetch failed" }
          git -C deps-src/pvdrivers/xeniface checkout --quiet FETCH_HEAD
          if (-not (Test-Path deps-src/pvdrivers/xeniface/include/xencontrol.h)) { throw "xencontrol.h missing after checkout" }
          # Installer sources at the pinned release commit.
          git clone --quiet https://github.com/QubesOS/qubes-installer-qubes-os-windows-tools.git installer-src
          if ($LASTEXITCODE -ne 0) { throw "installer clone failed" }
          git -C installer-src checkout --quiet $env:INSTALLER_SHA
          if ($LASTEXITCODE -ne 0) { throw "installer checkout failed" }

      - name: Shadow every set-version script with the QWT-NG stamper; wire one version into every shipped binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = "${{ github.workspace }}"
          $stamper = "$ws\tools\stamp-version.ps1"
          # ONE generator for every binary. Upstream's set-version.ps1 / set_version.ps1 emit <ver>.0;
          # ours emits <ver>.<build_rev> with the IDENTICAL CLI (<versionfile> <header>, positional),
          # so every PreBuildEvent / target that already calls a version script stamps the release
          # build number with no source change in those repos.
          # FOUR scripts, not one. Only windows-utils, gui-agent and core-agent (qwt-version.props) go
          # through $(QB_SCRIPTS)\set-version.ps1. pvdrivers (libxenvchan), core-vchan-xen (libvchan)
          # and core-qubesdb (qubesdb-daemon's PreBuildEvent, which the .sln makes qubesdb-client and
          # qubesdb-cmd depend on) each call their OWN set_version.ps1 - verified against the pinned
          # refs 2026-09-09. A builderv2-only shadow would never reach those three: their PreBuildEvents
          # would overwrite any pre-generated header with <ver>.0 and the DLL would ship unstamped
          # while this log said otherwise. A script missing from where the pin puts it THROWS.
          $shadows = @(
            "$ws\deps-src\builderv2\qubesbuilder\plugins\build_windows\scripts\set-version.ps1",
            "$ws\deps-src\pvdrivers\set_version.ps1",
            "$ws\deps-src\core-vchan-xen\windows\set_version.ps1",
            "$ws\deps-src\core-qubesdb\windows\set_version.ps1"
          )
          foreach ($s in $shadows) {
            if (-not (Test-Path -LiteralPath $s -PathType Leaf)) { throw "version script not where the pinned checkout puts it: $s (re-verify the pin's PreBuildEvent before wiring)" }
            Copy-Item -LiteralPath $stamper -Destination $s -Force
          }
          # Prove the shadow took and that the environment carries the run number BEFORE any build:
          # a MISSING_BUILD_REV must fail here, in a step named for it, not inside some rc.exe log.
          $v = & powershell -NoProfile -ExecutionPolicy Bypass -File $shadows[0] "$ws\agent\version" -Print
          if ($LASTEXITCODE -ne 0) { throw 'stamp-version.ps1 -Print failed (see stamp-version: FAIL line above)' }
          Write-Host "::notice title=version::every OURS binary in this run stamps $v"
          "QWTNG_FILEVERSION=$v" | Out-File -Append $env:GITHUB_ENV
          # ONE version file per SHIPPED binary, proven per binary. The check is driven from what
          # SHIPS - the deps-bins set, the gui-agent pair and the core-agent projects - and every
          # shipped binary must have a row naming the version file that is overwritten with
          # agent/version and how its header is generated (which shadowed script its build calls).
          # A shipped binary without a row THROWS (UNKNOWN_VERSION_PLUMBING); the build steps below
          # assert their own lists equal the ones wired here, so growing the shipped set without a
          # row is a failure, not a silent <ver>.0. Fixture: delete any row -> the step throws
          # naming that binary.
          $depsShipped = @('libxenvchan.dll','libvchan.dll','windows-utils.dll','qubesdb-client.dll','qubesdb-cmd.exe')
          $coreAgentProjects = @(
            'qrexec-wrapper', 'qrexec-agent', 'qrexec-client-vm',
            'advertise-tools', 'autologon', 'relocate-dir',
            'qubes-rpc-services\clipboard-copy', 'qubes-rpc-services\clipboard-paste',
            'qubes-rpc-services\file-receiver',  'qubes-rpc-services\file-sender',
            'qubes-rpc-services\get-image-rgba', 'qubes-rpc-services\open-in-vm',
            'qubes-rpc-services\open-url',       'qubes-rpc-services\set-gui-mode',
            'qubes-rpc-services\vm-file-editor', 'qubes-rpc-services\wait-for-logon'
          )
          $wiring = @{
            'libxenvchan.dll'    = @("$ws\deps-src\pvdrivers\version",      'libxenvchan.vcxproj PreBuildEvent -> pvdrivers\set_version.ps1 (shadow)')
            'libvchan.dll'       = @("$ws\deps-src\core-vchan-xen\version", 'libvchan.vcxproj PreBuildEvent -> windows\set_version.ps1 (shadow)')
            'windows-utils.dll'  = @("$ws\deps-src\windows-utils\version",  'windows-utils.vcxproj PreBuildEvent -> $(QB_SCRIPTS)\set-version.ps1 (shadow)')
            'qubesdb-client.dll' = @("$ws\deps-src\core-qubesdb\version",   '.sln dependency qubesdb-daemon PreBuildEvent -> windows\set_version.ps1 (shadow)')
            'qubesdb-cmd.exe'    = @("$ws\deps-src\core-qubesdb\version",   'same header as qubesdb-client; version.rc item added below')
            'gui-agent.exe'      = @("$ws\agent\version",                   'gui-agent.vcxproj PreBuildEvent -> $(QB_SCRIPTS)\set-version.ps1 (shadow)')
            'gui-watchdog.exe'   = @("$ws\agent\version",                   'same header as gui-agent, generated by the solution build (watchdog PreBuildEvent hardening pending in the agent repo)')
          }
          foreach ($p in $coreAgentProjects) { $wiring["$(Split-Path $p -Leaf).exe"] = @("$ws\core-agent\version", 'vs2022\qwt-version.props QwtStampVersion -> set-version.ps1 (shadow or -p:QwtSetVersionScript)') }
          $shipped = @($depsShipped) + @('gui-agent.exe', 'gui-watchdog.exe') + @($coreAgentProjects | ForEach-Object { "$(Split-Path $_ -Leaf).exe" })
          foreach ($b in $shipped) {
            if (-not $wiring.ContainsKey($b)) { throw "UNKNOWN_VERSION_PLUMBING: shipped binary $b has no stamping row - find how it stamps its VERSIONINFO and add it; do not exempt it" }
            $vf = $wiring[$b][0]
            if (-not (Test-Path -LiteralPath $vf -PathType Leaf)) { throw "UNKNOWN_VERSION_PLUMBING: $b names version file $vf, which does not exist" }
            # A binary whose version file IS agent/version needs no copy - and Copy-Item refuses a
            # self-copy ("Cannot overwrite the item ... with itself"), which failed the first run of
            # this step. Compare RESOLVED paths, not the strings: $vf is built by string
            # concatenation from $ws while the source is a separate literal, so they can name one
            # file without being equal as text.
            $srcVer = (Resolve-Path -LiteralPath "$ws\agent\version").ProviderPath
            $dstVer = (Resolve-Path -LiteralPath $vf).ProviderPath
            if ($srcVer -eq $dstVer) {
              Write-Host "version wired: $b <- $vf (IS agent/version - no copy needed)"
            } else {
              Copy-Item -LiteralPath $srcVer -Destination $dstVer -Force
              Write-Host "version wired: $b <- $vf ($($wiring[$b][1]))"
            }
          }
          # qubesdb-cmd.exe SHIPS with no VERSIONINFO at all: upstream's qubesdb-cmd.vcxproj (v4.3.1)
          # has no ResourceCompile item, although a version.rc sits next to it unreferenced (the
          # sibling client/daemon projects compile theirs). The release verifier's OURS_STAMPED gate
          # fails closed on an unstamped OURS PE, and exempting a shipped binary is what this step
          # forbids, so the item is added here - anchored on the project's one ClCompile line, and a
          # moved anchor or an already-present resource THROWS rather than guessing.
          $cmdDir  = "$ws\deps-src\core-qubesdb\windows\vs2022\qubesdb-cmd"
          $cmdProj = "$cmdDir\qubesdb-cmd.vcxproj"
          $cmdTxt  = [System.IO.File]::ReadAllText($cmdProj)
          $anchor  = '<ClCompile Include="..\..\..\client\qubesdb-cmd.c" />'
          if (([regex]::Matches($cmdTxt, [regex]::Escape($anchor))).Count -ne 1) { throw "qubesdb-cmd.vcxproj: anchor '$anchor' not found exactly once - re-verify QUBESDB_REF's version plumbing before wiring it" }
          if ($cmdTxt -match 'ResourceCompile') { throw 'qubesdb-cmd.vcxproj already compiles a resource - drop this patch and re-verify how it stamps' }
          if (-not (Test-Path -LiteralPath "$cmdDir\version.rc" -PathType Leaf)) { throw "qubesdb-cmd\version.rc is not in the pinned checkout - nothing to compile the VERSIONINFO from" }
          $cmdTxt = $cmdTxt.Replace($anchor, $anchor + "`r`n" + '    <ResourceCompile Include="version.rc" />')
          [System.IO.File]::WriteAllText($cmdProj, $cmdTxt)
          Write-Host 'qubesdb-cmd.vcxproj: ResourceCompile version.rc added'
          # Hand the wired sets to the build steps so THEY can refuse a list that drifted from this one.
          "QWTNG_WIRED_DEPS=$($depsShipped -join ',')"           | Out-File -Append $env:GITHUB_ENV
          "QWTNG_WIRED_COREAGENT=$($coreAgentProjects -join ',')" | Out-File -Append $env:GITHUB_ENV

      - name: Synthesize xencontrol import library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "deps-src\pvdrivers\xeniface\vs2022\x64\Windows10$env:CONFIG"
          New-Item -ItemType Directory -Force $out | Out-Null
          $def = @(
            'LIBRARY xencontrol.dll','EXPORTS',
            'XcClose','XcEvtchnBindInterdomain','XcEvtchnClose','XcEvtchnNotify',
            'XcEvtchnOpenUnbound','XcEvtchnUnmask','XcGnttabMapForeignPages',
            'XcGnttabPermitForeignAccess','XcGnttabPermitForeignAccess2',
            'XcGnttabRevokeForeignAccess','XcGnttabUnmapForeignPages','XcOpen',
            'XcRegisterLogger','XcSetLogLevel','XcStoreAddWatch','XcStoreDirectory',
            'XcStoreRead','XcStoreRemove','XcStoreRemoveWatch','XcStoreSetPermissions',
            'XcStoreWrite')
          $def | Set-Content -Encoding ascii "$out\xencontrol.def"
          & "${{ steps.vs.outputs.lib }}" /nologo /machine:x64 /def:"$out\xencontrol.def" /out:"$out\xencontrol.lib"
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed building xencontrol.lib" }

      - name: Build Qubes user-mode dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws      = "${{ github.workspace }}"
          $msbuild = "${{ steps.vs.outputs.msbuild }}"
          $cfg     = $env:CONFIG
          $env:QUBES_REPO  = "$ws\qubes-repo-libs"
          $env:QB_SCRIPTS  = "$ws\deps-src\builderv2\qubesbuilder\plugins\build_windows\scripts"
          function Refresh-QubesEnv {
            $inc=@(); $lib=@()
            Get-ChildItem $env:QUBES_REPO -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              if (Test-Path "$($_.FullName)\inc") { $inc += "$($_.FullName)\inc" }
              if (Test-Path "$($_.FullName)\lib") { $lib += "$($_.FullName)\lib" }
            }
            $env:QUBES_INCLUDES = ($inc -join ';')
            $env:QUBES_LIBS     = ($lib -join ';')
          }
          function MB([string]$proj, [string]$target) {
            $a = @($proj, '-nologo', '-m', '-v:minimal', "-p:Platform=x64", "-p:Configuration=$cfg")
            if ($target) { $a += "-t:$target" }
            & $msbuild @a
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed: $proj $target" }
          }
          function Stage([string]$comp, [string[]]$inc, [string[]]$lib) {
            New-Item -ItemType Directory -Force "$env:QUBES_REPO\$comp\inc" | Out-Null
            New-Item -ItemType Directory -Force "$env:QUBES_REPO\$comp\lib" | Out-Null
            $inc | ForEach-Object { Copy-Item $_ "$env:QUBES_REPO\$comp\inc\" -Force }
            $lib | ForEach-Object {
              $want = Split-Path $_ -Leaf
              $src  = $_
              if (-not (Test-Path $src)) {
                $root = $src
                while ($root -and -not (Test-Path (Join-Path $root '.git')) -and (Split-Path $root -Parent)) {
                  $root = Split-Path $root -Parent
                }
                if (-not $root) { $root = "$ws\deps-src" }
                $hit = Get-ChildItem $root -Recurse -Filter $want -ErrorAction SilentlyContinue |
                       Where-Object FullName -match "x64\\$cfg" |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if (-not $hit) { throw "cannot locate $want under $root after building $comp" }
                $src = $hit.FullName
                Write-Host "  (located $want at $src)"
              }
              Copy-Item $src "$env:QUBES_REPO\$comp\lib\" -Force
            }
            Refresh-QubesEnv
          }
          MB "$ws\deps-src\pvdrivers\vs2022\libxenvchan\libxenvchan.vcxproj" ''
          Stage 'vmm-xen-windows-pvdrivers' `
            @("$ws\deps-src\pvdrivers\include\libxenvchan.h",
              "$ws\deps-src\pvdrivers\include\libxenvchan_ring.h",
              "$ws\deps-src\pvdrivers\xeniface\include\xencontrol.h",
              "$ws\deps-src\pvdrivers\xeniface\include\xeniface_ioctls.h") `
            @("$ws\deps-src\pvdrivers\vs2022\x64\$cfg\libxenvchan\libxenvchan.lib",
              "$ws\deps-src\pvdrivers\xeniface\vs2022\x64\Windows10$cfg\xencontrol.lib")
          MB "$ws\deps-src\core-vchan-xen\windows\vs2022\core-vchan-xen.sln" 'libvchan'
          Stage 'core-vchan-xen' `
            @("$ws\deps-src\core-vchan-xen\windows\include\libvchan.h") `
            @("$ws\deps-src\core-vchan-xen\windows\vs2022\x64\$cfg\libvchan\libvchan.lib")
          MB "$ws\deps-src\windows-utils\vs2022\windows-utils.sln" ''
          Stage 'windows-utils' `
            @(Get-ChildItem "$ws\deps-src\windows-utils\include\*.h" | % FullName) `
            @("$ws\deps-src\windows-utils\vs2022\x64\$cfg\windows-utils\windows-utils.lib")
          MB "$ws\deps-src\core-qubesdb\windows\vs2022\core-qubesdb.sln" 'qubesdb-client'
          Stage 'core-qubesdb' `
            @("$ws\deps-src\core-qubesdb\include\qubesdb.h",
              "$ws\deps-src\core-qubesdb\include\qubesdb-client.h") `
            @("$ws\deps-src\core-qubesdb\windows\vs2022\x64\$cfg\qubesdb-client\qubesdb-client.lib")
          # qubesdb-cmd.exe (wave 2): same solution; target name verified against the pinned
          # ref (windows/vs2022/core-qubesdb.sln @ v4.3.1 lists qubesdb-client, qubesdb-cmd,
          # qubesdb-daemon). Built AFTER qubesdb-client: its LibraryPath resolves
          # qubesdb-client.lib from the sibling output dir the previous MB just filled.
          # qubesdb-daemon is deliberately NOT built (wave 3: boot-critical service).
          MB "$ws\deps-src\core-qubesdb\windows\vs2022\core-qubesdb.sln" 'qubesdb-cmd'
          # The DLLs these builds produce used to be DISCARDED right here - only the .libs
          # were staged - while the MSI shipped the stock copies: the exact silent-stock
          # class the substitution table ends. Collect them (plus qubesdb-cmd.exe) into
          # deps-bins for signing and staging. A miss THROWS; it never falls back to stock.
          # Version note (measured 2026-08-28): the stock 4.2.2 qubesdb-client.dll builds
          # from core-qubesdb >= v4.2.8 (its PDB path contains the windows\vs2022 tree,
          # which first appears in v4.2.8); the client-code diff v4.2.7..v4.3.1 is the
          # mechanical WIN32->_WIN32 rename only and include/qubesdb.h (the wire protocol)
          # is unchanged - so shipping the v4.3.1-built client DLL against the stock
          # daemon carries no source-level protocol delta. QUBESDB_REF stays v4.3.1.
          New-Item -ItemType Directory -Force "$ws\deps-bins" | Out-Null
          function Collect([string]$src, [string]$root) {
            $want = Split-Path $src -Leaf
            if (-not (Test-Path $src)) {
              $hit = Get-ChildItem $root -Recurse -Filter $want -ErrorAction SilentlyContinue |
                     Where-Object FullName -match "x64\\$cfg" |
                     Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if (-not $hit) { throw "deps-bins: cannot locate $want under $root" }
              $src = $hit.FullName
              Write-Host "  (located $want at $src)"
            }
            Copy-Item $src "$ws\deps-bins\" -Force
          }
          Collect "$ws\deps-src\pvdrivers\vs2022\x64\$cfg\libxenvchan\libxenvchan.dll"                  "$ws\deps-src\pvdrivers"
          Collect "$ws\deps-src\core-vchan-xen\windows\vs2022\x64\$cfg\libvchan\libvchan.dll"           "$ws\deps-src\core-vchan-xen"
          Collect "$ws\deps-src\windows-utils\vs2022\x64\$cfg\windows-utils\windows-utils.dll"          "$ws\deps-src\windows-utils"
          Collect "$ws\deps-src\core-qubesdb\windows\vs2022\x64\$cfg\qubesdb-client\qubesdb-client.dll" "$ws\deps-src\core-qubesdb"
          Collect "$ws\deps-src\core-qubesdb\windows\vs2022\x64\$cfg\qubesdb-cmd\qubesdb-cmd.exe"       "$ws\deps-src\core-qubesdb"
          $expect  = 'libxenvchan.dll','libvchan.dll','windows-utils.dll','qubesdb-client.dll','qubesdb-cmd.exe'
          # The version-wiring step declared which shipped deps it covered; a dep added here
          # without a stamping row there must fail, not ship as <ver>.0.
          if (($expect -join ',') -ne $env:QWTNG_WIRED_DEPS) { throw "deps-bins set '$($expect -join ',')' differs from the set the version-wiring step covered '$env:QWTNG_WIRED_DEPS' - add the row there first" }
          $have    = (Get-ChildItem "$ws\deps-bins" -File).Name
          $absent  = @($expect | Where-Object { $_ -notin $have })
          if ($absent.Count) { throw "deps-bins incomplete: $($absent -join ', ')" }
          Get-ChildItem "$ws\deps-bins" | ForEach-Object { Write-Host "deps-bins: $($_.Name) $($_.Length) bytes" }
          "QUBES_INCLUDES=$env:QUBES_INCLUDES" | Out-File -Append $env:GITHUB_ENV
          "QUBES_LIBS=$env:QUBES_LIBS"         | Out-File -Append $env:GITHUB_ENV

      - name: Build gui-agent (our fork)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws  = "${{ github.workspace }}"
          $env:QB_SCRIPTS = "$ws\deps-src\builderv2\qubesbuilder\plugins\build_windows\scripts"
          $env:QUBES_INCLUDES = "$ws\deps-src\gui-common\include;" + $env:QUBES_INCLUDES
          # OFF unless a workflow_dispatch run asks for it: a release artifact must not
          # contain the injector. The value is echoed so the run log states which kind of
          # binary this is, and the built .exe carries g_FaultInjectionMarker for the guest
          # to confirm the same thing without trusting the log.
          $fi = if ('${{ inputs.fault_injection }}' -eq 'true') { '1' } else { '0' }
          Write-Host "QGA_FAULT_INJECTION=$fi"
          & "${{ steps.vs.outputs.msbuild }}" "$ws\agent\vs2022\gui-agent-windows.sln" `
              -nologo -m -v:minimal -p:Platform=x64 "-p:Configuration=$env:CONFIG" `
              "-p:TreatWarningAsError=false" "-p:QgaFaultInjection=$fi"
          if ($LASTEXITCODE -ne 0) { throw "gui-agent build failed" }

      # Helper EXES the agent launches: wgcbroker.exe (WGC capture broker - the de-slice broker
      # path) and notifhost.exe (the notification bridge) in the user session via Task Scheduler,
      # plus etwproxy.exe (the GUI-DLL-free ETW signal proxy, 2026-09-05 console split) as the
      # qubes-etwproxy account in session 0. These are standalone tools\*.vcxproj, NOT part of
      # gui-agent-windows.sln and NOT in the stock MSI, so they have to be built and staged
      # EXPLICITLY - the gap that shipped the de-slice broker with no wgcbroker.exe on the guest
      # (packaging finding 2026-09-04). Plain v143, /MT; wgcbroker/notifhost use C++/WinRT,
      # etwproxy deliberately does NOT (see the import gate below).
      - name: Build user-session helpers (wgcbroker, notifhost, etwproxy)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mb = "${{ steps.vs.outputs.msbuild }}"
          foreach ($p in @(@('wgcbroker','tools\wgcbroker\wgcbroker.vcxproj','tools\wgcbroker\x64\Release\wgcbroker.exe'),
                           @('notifhost','tools\notifhost\notifhost.vcxproj','tools\notifhost\x64\Release\notifhost.exe'),
                           @('etwproxy', 'tools\notifhost\etwproxy.vcxproj', 'tools\notifhost\x64\Release\etwproxy.exe'))) {
            & $mb $p[1] /p:Configuration=Release /p:Platform=x64 /t:Build
            if ($LASTEXITCODE -ne 0) { throw "$($p[0]) msbuild failed" }
            if (-not (Test-Path $p[2])) { throw "$($p[0]) built but $($p[2]) is missing" }
            Get-ChildItem $p[2]
          }
          # IMPORT-TABLE GATE on the SHIPPING etwproxy.exe: it runs under the bare
          # qubes-etwproxy batch token in session 0, which has no window station; a user32 or
          # gdi32 import means 0xC0000142 STATUS_DLL_INIT_FAILED before main (the rig-proven
          # failure the console split removed). Refuse to ship a binary that regressed it.
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Recurse `
                       -Filter dumpbin.exe -ErrorAction SilentlyContinue |
                     Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found - cannot verify the etwproxy import table' }
          $imports = (& $dumpbin.FullName /imports tools\notifhost\x64\Release\etwproxy.exe) -join "`n"
          if ($imports -match '(?im)^\s*(user32|gdi32)\.dll\s*$') {
            throw 'etwproxy.exe imports user32/gdi32 - would die 0xC0000142 winsta-less; NOT shipping it'
          }
          # Seen-to-fail proof: the same check against notifhost.exe (which imports user32) must trip.
          $ni = (& $dumpbin.FullName /imports tools\notifhost\x64\Release\notifhost.exe) -join "`n"
          if (-not ($ni -match '(?im)^\s*user32\.dll\s*$')) {
            throw 'import-gate selftest FAILED: user32.dll not detected in notifhost.exe'
          }
          Write-Host 'etwproxy.exe import table clean (no user32/gdi32); gate selftest OK'

      # core-agent-windows (our fork) carries the qrexec-wrapper drain-race fix: do not report the
      # exit code before the i/o pumps have drained (ac33bc9), drain the vchan before leaving on
      # close (e5e94b8). Built HERE because this job has already staged the exact dependency set
      # those projects need (libvchan, xencontrol, windows-utils, qubesdb-client).
      #
      # Beyond the three qrexec binaries this builds every user-mode tool exe in the fork (the
      # migration table's wave 2): the per-invocation rpc tools, wait-for-logon, advertise-tools
      # and autologon - all v143, all against the deps staged above, all outputting to
      # vs2022\x64\<cfg>\<name>\<name>.exe. NOT built, deliberately:
      #   - (relocate-dir USED to be excluded here for want of the WDK. That was a RUNNER gap, not
      #     a property of the source: the WDK install recipe already existed in build.yml and is
      #     now run in this workflow too, so relocate-dir is built like everything else. Its
      #     vcxproj needs PlatformToolset WindowsApplicationForDrivers10.0 - which is the WDK's VS
      #     integration, delivered by the VSIX - plus ntifs.h and ntdllp.lib.)
      #   - network-setup: our own tooling retires it (pvnic-selfprime deletes it on-guest);
      #     building it would re-ship a defect. End state is deleting its wxs component, not
      #     substituting the binary.
      #
      # REQUIRED, unlike build.yml's copy of this step. build.yml is the iteration path and lets a
      # core-agent break through with a warning; this is the RELEASE path, and a release that
      # silently falls back to the stock binary is the exact bug this build exists to end: the fix
      # was merged, CI was green, and every guest kept running the stock wrapper for months.
      - name: Build core-agent (user-mode tools) fork
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws  = "${{ github.workspace }}"
          $env:QB_SCRIPTS = "$ws\deps-src\builderv2\qubesbuilder\plugins\build_windows\scripts"
          # qwt_version.h is GENERATED PER PROJECT by core-agent's vs2022\qwt-version.props
          # (target QwtStampVersion, into each project's $(IntDir)). It is deliberately NOT
          # generated up front here any more: a pre-generated header kept the build green even if
          # that target never fired, masking exactly the failure it exists to make visible. With
          # nothing pre-generated, a project whose import is missing fails with RC1015 on
          # qwt_version.h - that is the load-bearing fixture for the imports.
          # WDK, for relocate-dir. Same recipe as build.yml (choco windowsdriverkit11 + the VSIX
          # into VS2022) - relocate-dir.vcxproj builds with PlatformToolset
          # WindowsApplicationForDrivers10.0 and links ntdllp.lib, both of which arrive with that
          # integration. Without it MSBuild fails on an unknown toolset, which is why this project
          # was excluded rather than fixed. Idempotent: choco is a no-op if already present.
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\ntifs.h")) {
            choco install windowsdriverkit11 --no-progress -y
            $vsix = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix" -Recurse -Filter '*.vsix' -ErrorAction SilentlyContinue |
                    Select-Object -First 1
            if (-not $vsix) { throw "WDK.vsix not found after choco install" }
            $inst = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Recurse -Filter VSIXInstaller.exe |
                    Select-Object -First 1
            Start-Process $inst.FullName -ArgumentList '/quiet', $vsix.FullName -Wait
          }
          # PIN relocate-dir TO THE SDK VERSION THAT ACTUALLY HAS THE KM HEADERS.
          # Measured 2026-09-08: with the WDK installed and the toolset resolving
          # ("Building 'relocate-dir' with toolset 'WindowsApplicationForDrivers10.0'"), the compile
          # still died on C1083 ntifs.h. The vcxproj asks for $(LatestTargetPlatformVersion), which
          # resolves to the SDK version Visual Studio ships - and that directory has no km\ subtree.
          # ntifs.h lives under the version CHOCO installed. Find the version that owns the header
          # and build this one project against it.
          $ntifs = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Recurse -Filter ntifs.h -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $ntifs) { throw "WDK install did not deliver ntifs.h - relocate-dir cannot build" }
          # .../Include/<version>/km/ntifs.h  ->  <version> is two levels up from the file
          $env:WDK_KM_VERSION = $ntifs.Directory.Parent.Name
          Write-Host "WDK km headers: $($ntifs.FullName)  (WindowsTargetPlatformVersion=$env:WDK_KM_VERSION)"
          # Relative vcxproj paths under vs2022\ (the rpc tool projects live one level down).
          # Exe name == project leaf name == the wxs leaf stage-qwt-repo parses, verified
          # against the pinned installer sources 2026-08-28.
          $projects = @(
            'qrexec-wrapper', 'qrexec-agent', 'qrexec-client-vm',
            'advertise-tools', 'autologon', 'relocate-dir',
            'qubes-rpc-services\clipboard-copy', 'qubes-rpc-services\clipboard-paste',
            'qubes-rpc-services\file-receiver',  'qubes-rpc-services\file-sender',
            'qubes-rpc-services\get-image-rgba', 'qubes-rpc-services\open-in-vm',
            'qubes-rpc-services\open-url',       'qubes-rpc-services\set-gui-mode',
            'qubes-rpc-services\vm-file-editor', 'qubes-rpc-services\wait-for-logon'
          )
          # The version-wiring step declared which core-agent projects it covered; a project added
          # here without a row there must fail, not ship as <ver>.0.
          if (($projects -join ',') -ne $env:QWTNG_WIRED_COREAGENT) { throw "core-agent project list differs from the set the version-wiring step covered '$env:QWTNG_WIRED_COREAGENT' - add the row there first" }
          foreach ($proj in $projects) {
            $name = Split-Path $proj -Leaf
            $vcx = "$ws\core-agent\vs2022\$proj\$name.vcxproj"
            if (-not (Test-Path $vcx)) { throw "core-agent project not found: $vcx" }
            # relocate-dir is the only project here that needs the WDK's km headers, so it is the
            # only one pinned to the version that owns them; everything else keeps the default.
            #
            # PINNING THE VERSION IS NOT ENOUGH. Measured 2026-09-08: with
            # WindowsTargetPlatformVersion=10.0.26100.0 and ntifs.h confirmed at
            # ...\Include\10.0.26100.0\km\ntifs.h, the compile STILL failed C1083. The WDK targets
            # add the km\ include directory only for driver ConfigurationTypes; this is a user-mode
            # application that merely uses the drivers TOOLSET, so km\ is never put on the include
            # path at all. Add it (and the matching km lib dir for ntdllp.lib) through the
            # compiler's own CL/LIB environment levers, which do not fight MSBuild's property
            # evaluation the way an -p:IncludePath override would.
            $extra = @()
            $savedCL = $env:CL; $savedLIB = $env:LIB
            if ($name -eq 'relocate-dir') {
              $extra += "-p:WindowsTargetPlatformVersion=$env:WDK_KM_VERSION"
              $kmInc = Split-Path $ntifs.FullName -Parent
              # FIND ntdllp.lib, do not assume where it lives. Assuming Lib\<ver>\km\x64 was wrong
              # (measured 2026-09-08: the guard fired) - it is a private ntdll import library and the
              # WDK does not file it with the kernel-mode libs. Locate it the same way ntifs.h was
              # located, from the file itself, so the layout can change without breaking this again.
              $ntdllp = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter ntdllp.lib -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
              if (-not $ntdllp) {
                throw "ntdllp.lib not found anywhere under Windows Kits (x64) - relocate-dir cannot link"
              }
              $kmLib = $ntdllp.Directory.FullName
              $env:CL  = "/I`"$kmInc`""
              $env:LIB = "$kmLib;$env:LIB"
              Write-Host "relocate-dir: CL=$env:CL"
              Write-Host "relocate-dir: ntdllp.lib at $($ntdllp.FullName)"
            }
            # -p:QwtSetVersionScript names the repo's stamper DIRECTLY, so this build does not
            # depend on the builderv2 shadow copy at all (qwt-version.props: an explicit script
            # wins over $(QB_SCRIPTS)\set-version.ps1).
            & "${{ steps.vs.outputs.msbuild }}" $vcx `
                -nologo -m -v:minimal -p:Platform=x64 "-p:Configuration=$env:CONFIG" `
                "-p:TreatWarningAsError=false" "-p:QwtSetVersionScript=$ws\tools\stamp-version.ps1" @extra
            $env:CL = $savedCL; $env:LIB = $savedLIB   # never leak the km paths into other projects
            if ($LASTEXITCODE -ne 0) { throw "core-agent: $name build failed ($LASTEXITCODE)" }
          }
          $caOut = "$ws\core-agent\vs2022\x64\$env:CONFIG"
          New-Item -ItemType Directory -Force core-agent-bins | Out-Null
          foreach ($proj in $projects) {
            $name = Split-Path $proj -Leaf
            $exe = "$caOut\$name\$name.exe"
            if (-not (Test-Path $exe)) { throw "core-agent: $name.exe was not produced" }
            Copy-Item $exe core-agent-bins\ -Force
          }
          if ((Get-ChildItem core-agent-bins -Filter *.exe).Count -ne $projects.Count) {
            throw "core-agent-bins does not hold one exe per project built"
          }
          Get-ChildItem core-agent-bins | ForEach-Object { Write-Host "core-agent: $($_.Name) $($_.Length) bytes" }

      - name: Sign our binaries, export sign.crt
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "agent\vs2022\x64\$env:CONFIG"
          New-Item -ItemType Directory -Force agent-bins | Out-Null
          Copy-Item "$out\gui-agent\gui-agent.exe"       agent-bins\
          Copy-Item "$out\gui-watchdog\gui-watchdog.exe" agent-bins\
          # The user-session helpers ride in agent-bins too, so they are signed here and exported
          # in package-qwt-full below; make-setup.ps1 stages them into the setup tree's bin\, from
          # where Install-QwtImproved's bin-overlay installs them next to gui-agent.exe.
          New-Item -ItemType Directory -Force helper-bins | Out-Null
          Copy-Item 'tools\wgcbroker\x64\Release\wgcbroker.exe' helper-bins\
          Copy-Item 'tools\notifhost\x64\Release\notifhost.exe' helper-bins\
          Copy-Item 'tools\notifhost\x64\Release\etwproxy.exe'  helper-bins\
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object FullName -match 'x64' | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          # ONE cert for every PE binary we build - the gui-agent pair, the core-agent tool
          # exes (signed IN PLACE in core-agent-bins: stage-qwt-repo and the package both
          # take them from there now, so the old copy-into-agent-bins detour is gone), and
          # the dep DLLs + qubesdb-cmd.exe in deps-bins. The guest trusts the cert from
          # firstboot / the MSI's gui-agent-windows sign.crt. The previous shape of this
          # step filtered on *.exe only, which would have left every DLL unsigned.
          $toSign  = @(Get-ChildItem agent-bins -Filter *.exe)
          $toSign += @(Get-ChildItem helper-bins -Filter *.exe)
          $toSign += @(Get-ChildItem core-agent-bins -Filter *.exe)
          $toSign += @(Get-ChildItem deps-bins\* -Include *.exe, *.dll)
          # 2 gui-agent + 3 helpers (wgcbroker, notifhost, etwproxy) + 15 core-agent + 5 deps:
          # fewer means a bins dir went missing or a copy loop silently shrank - fail here,
          # not with an unsigned binary shipping.
          if ($toSign.Count -lt 25) { throw "expected at least 25 binaries to sign, found $($toSign.Count)" }
          foreach ($f in $toSign) {
            & $signtool.FullName sign /fd sha256 /f cert.pfx /p $env:PFX_PASS $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($f.Name)" }
          }
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              (Resolve-Path cert.pfx).Path, $env:PFX_PASS)
          [IO.File]::WriteAllBytes("$pwd\agent-bins\sign.crt",
              $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          Remove-Item cert.pfx

      - name: Extract stock MSI (admin image)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path 'vendor\qwt-4.2.2\installer.msi').Path
          $h = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:STOCK_MSI_SHA256) { throw "vendored MSI hash mismatch: $h" }
          $img = "$env:RUNNER_TEMP\qwt-admin-image"
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$img`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed: $($p.ExitCode)" }
          $n = (Get-ChildItem $img -Recurse -File).Count
          Write-Host "admin image: $n files"
          if ($n -lt 60) { throw 'admin image implausibly small' }
          "QWT_ADMIN_IMAGE=$img" | Out-File -Append $env:GITHUB_ENV

      - name: Stage QUBES_REPO for the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = "${{ github.workspace }}"
          & .\packaging\stage-qwt-repo.ps1 `
            -InstallerRepo "$ws\installer-src" `
            -AdminImage    $env:QWT_ADMIN_IMAGE `
            -AgentBins     "$ws\agent-bins" `
            -CoreAgentBins "$ws\core-agent-bins" `
            -RpcSources    "$ws\core-agent\src\qubes-rpc-services" `
            -VMExecSource  "$ws\guest\VMExec.ps1" `
            -DepsBins      "$ws\deps-bins" `
            -OurCert       "$ws\agent-bins\sign.crt" `
            -VendorCerts   "$ws\vendor\qwt-4.2.2\certs" `
            -OutRepo       "$ws\qubes-repo"
          "QUBES_REPO=$ws\qubes-repo" | Out-File -Append $env:GITHUB_ENV

      # ROOT FIX for the mid-install brick, measured 2026-08-28 and named by Windows itself
      # (event 1074): xenbus_monitor_9_1_0_0.exe RESTARTS the guest ~30 s into msiexec when a PV
      # reboot request is pending, and the interrupted driver install leaves the guest unusable.
      # It can do that because THIS INF - ours, inside an MSI we build - installs the service with
      # SPSVCSINST_STARTSERVICE and StartType=auto. The installer's once-a-second suppressor cannot
      # win a race against a service that reboots the instant it starts, so the fix is here rather
      # than there, and it covers the interactive install from the ISO too, which has no suppressor
      # at all. The script FAILS the build if either edit does not apply - a silently unpatched INF
      # would ship the brick.
      - name: Neutralise the xenbus_monitor service in our xenbus.inf
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = "${{ github.workspace }}"
          [IO.File]::WriteAllBytes('cat.pfx', [Convert]::FromBase64String($env:PFX_B64))
          & .\packaging\patch-xenbus-inf.ps1 `
            -InfPath     "$ws\qubes-repo\vmm-xen-windows-pvdrivers\bin\xenbus.inf" `
            -PfxPath     "$pwd\cat.pfx" `
            -PfxPassword $env:PFX_PASS
          Remove-Item cat.pfx -Force
          # Show what shipped, so the log carries the proof rather than a claim.
          Select-String -Path "$ws\qubes-repo\vmm-xen-windows-pvdrivers\bin\xenbus.inf" `
                        -Pattern 'AddService\s*=\s*xenbus_monitor|StartType' | ForEach-Object { "  $($_.Line.Trim())" }

      - name: Populate WiX .distfiles (pinned NuGet packages)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = "${{ github.workspace }}"
          $dist = "$ws\installer-src\.distfiles"
          New-Item -ItemType Directory -Force $dist | Out-Null
          foreach ($p in 'wixtoolset.sdk','wixtoolset.bal.wixext','wixtoolset.difxapp.wixext',
                         'wixtoolset.iis.wixext','wixtoolset.ui.wixext','wixtoolset.util.wixext') {
            $f = "$p.4.0.5.nupkg"
            Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$p/4.0.5/$f" -OutFile "$dist\$f"
            $want = (Get-Content "$ws\installer-src\$f.sha256" -Raw).Trim().ToLower()
            $have = (Get-FileHash "$dist\$f" -Algorithm SHA256).Hash.ToLower()
            if ($have -ne $want) { throw "sha256 mismatch for ${f}: $have != $want" }
            Write-Host "$f ok"
          }

      - name: Stage fake EWDK tree (vc_redist for the bundle)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $redist = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Recurse `
                    -Filter vc_redist.x64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $redist) { throw 'vc_redist.x64.exe not found on runner' }
          $fake = "$env:RUNNER_TEMP\fake-ewdk"
          $dir = "$fake\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Redist\MSVC\v143"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $redist.FullName "$dir\vc_redist.x64.exe"
          "EWDK_PATH=$fake" | Out-File -Append $env:GITHUB_ENV

      - name: Stamp our deliverable version into the installer sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = "${{ github.workspace }}"
          # The CreateVersionWxi CodeTask reads installer-src\version to stamp the MSI
          # ProductVersion. Upstream's file says 4.2.2; overwrite it with OUR deliverable
          # version (single source of truth: agent/version) so the rebuilt MSI/bundle
          # report 4.3.0 and Windows treats it as an upgrade over a stock 4.2.2 install.
          $ngVersion = (Get-Content "$ws\agent\version" -Raw).Trim()
          if ($ngVersion -notmatch '^\d+\.\d+\.\d+$') { throw "bad agent/version: '$ngVersion'" }
          Set-Content -LiteralPath "$ws\installer-src\version" -Value $ngVersion -NoNewline
          Write-Host "installer-src\version stamped: $ngVersion"

      - name: Build installer.msi + Burn bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = "${{ github.workspace }}"
          $msbuild = "${{ steps.vs.outputs.msbuild }}"
          $env:TEST_SIGN  = '1'
          $env:QB_SCRIPTS = "$ws\deps-src\builderv2\qubesbuilder\plugins\build_windows\scripts"
          # CWD must be vs2022\installer: the CreateVersionWxi CodeTask reads ..\..\version
          # and writes version.wxi relative to the PROCESS working directory.
          Push-Location "$ws\installer-src\vs2022\installer"
          & $msbuild ..\install-helper\install-helper.vcxproj -nologo -m -v:minimal `
              -p:Platform=x64 "-p:Configuration=$env:CONFIG"
          if ($LASTEXITCODE -ne 0) { throw 'install-helper build failed' }
          & $msbuild -restore ..\installer.sln -nologo -m:1 -v:minimal `
              -p:Platform=x64 "-p:Configuration=$env:CONFIG"
          if ($LASTEXITCODE -ne 0) { throw 'installer.sln build failed' }
          Pop-Location

      - name: Collect package + MANIFEST
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = "${{ github.workspace }}"
          New-Item -ItemType Directory -Force package-qwt-full | Out-Null
          $msi = Get-ChildItem "$ws\installer-src\vs2022\x64\$env:CONFIG" -Recurse -Filter installer.msi |
                 Select-Object -First 1
          if (-not $msi) { throw 'installer.msi not produced' }
          Copy-Item $msi.FullName package-qwt-full\
          $bundle = Get-ChildItem "$ws\installer-src" -Filter 'qubes-windows-tools-*.exe' |
                    Select-Object -First 1
          if ($bundle) { Copy-Item $bundle.FullName package-qwt-full\ }
          else { Write-Warning 'Burn bundle not found at installer repo root' }
          # EVERYTHING the package ships goes in BEFORE the manifest/sums are computed. The
          # old order hashed first and copied after, so the loose agent exes and the whole
          # core-agent-bins dir shipped UNHASHED - the standing MANIFEST gap.
          Copy-Item agent-bins\gui-agent.exe, agent-bins\gui-watchdog.exe, agent-bins\sign.crt package-qwt-full\
          # SIGNED helpers -> their own dir. make-setup.ps1 stages these into the setup tree's
          # bin\ so Install-QwtImproved installs wgcbroker.exe/notifhost.exe/etwproxy.exe next to
          # gui-agent.exe (de-slice broker + notification bridge + ETW signal proxy; a helper
          # missing from this list ships NOWHERE - the 2026-09-04 packaging lesson).
          New-Item -ItemType Directory -Force package-qwt-full\helper-bins | Out-Null
          Copy-Item helper-bins\wgcbroker.exe, helper-bins\notifhost.exe, helper-bins\etwproxy.exe package-qwt-full\helper-bins\ -Force
          # SIGNED fork core-agent binaries -> their own dir (signed in place by the signing
          # step). release-package points make-setup.ps1 -CoreAgentBins at it; make-setup
          # stages ONLY qrexec-wrapper.exe into the payload bin\ (recorded policy), the rest
          # ride along for provenance and for stage-qwt-repo's table to claim as it grows.
          New-Item -ItemType Directory -Force package-qwt-full\core-agent-bins | Out-Null
          Copy-Item core-agent-bins\*.exe package-qwt-full\core-agent-bins\ -Force
          # Our built+signed user-mode dep DLLs + qubesdb-cmd.exe - the bytes staged into
          # the MSI (stage-qwt-repo -DepsBins), published so the artifact carries the exact
          # binaries the MSI embeds.
          New-Item -ItemType Directory -Force package-qwt-full\deps-bins | Out-Null
          Copy-Item deps-bins\* package-qwt-full\deps-bins\ -Force
          git config --global --add safe.directory $ws
          git config --global --add safe.directory $ws/agent
          git config --global --add safe.directory $ws/core-agent
          $manifest = [ordered]@{
            package          = 'qwt-full'
            built            = (Get-Date -AsUTC -Format o)
            repo_sha         = (git -C $ws rev-parse HEAD).Trim()
            agent_sha        = (git -C $ws/agent rev-parse HEAD).Trim()
            agent_describe   = (git -C $ws/agent describe --tags --long --always).Trim()
            core_agent_sha   = (git -C $ws/core-agent rev-parse HEAD).Trim()
            installer_sha    = $env:INSTALLER_SHA
            stock_msi_sha256 = $env:STOCK_MSI_SHA256
            files            = [ordered]@{}
          }
          $pkgRoot = (Resolve-Path package-qwt-full).Path
          $all = Get-ChildItem package-qwt-full -Recurse -File | Sort-Object FullName
          foreach ($f in $all) {
            $rel = $f.FullName.Substring($pkgRoot.Length + 1) -replace '\\', '/'
            $manifest.files[$rel] = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          }
          # Legacy keys make-setup.ps1 REQUIRES (it throws without them, corroborating the
          # loose agent exes against what the MSI embeds): same bytes, historical names.
          foreach ($f in 'gui-agent.exe','gui-watchdog.exe') {
            $manifest.files["agent-bins/$f"] = (Get-FileHash "$ws\agent-bins\$f" -Algorithm SHA256).Hash.ToLower()
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content package-qwt-full\MANIFEST.json
          $all | ForEach-Object {
            $rel = $_.FullName.Substring($pkgRoot.Length + 1) -replace '\\', '/'
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $rel
          } | Set-Content package-qwt-full\SHA256SUMS.txt
          Get-Content package-qwt-full\MANIFEST.json

      - uses: actions/upload-artifact@v4
        with:
          name: qwt-full-package
          path: package-qwt-full/
          retention-days: 14
