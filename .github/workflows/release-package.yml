# release-package: produce the two artifacts a user actually installs.
#
#   qwt-improved-setup   a directory: the real QWT 4.2.2 MSI rebuilt from upstream WiX
#                        sources with OUR gui-agent, plus certs, VC++ runtime, the IddCx
#                        driver payload, a two-stage install script, README and MANIFEST.
#                        Installs on a CLEAN Windows guest. NOT an overlay.
#   qwt-improved-iso     the same tree wrapped in an ISO 9660 image, so it can be attached
#                        to a qube with no networking.
#
# This is the counterpart to build.yml's `package` job, which produces the OVERLAY updater
# (agent binaries only, requires QWT already installed). Both are kept: the overlay is the
# fast path for iterating on the agent, this is the thing you hand someone.
name: release-package

on:
  workflow_dispatch:
    inputs:
      volume_id:
        description: 'ISO volume label'
        required: false
        default: 'QWT_IMPROVED'
  push:
    # t2/release-package is where this workflow is developed and validated. GitHub only
    # offers workflow_dispatch for files that exist on the DEFAULT branch, so until this
    # merges, a push trigger is the only way to exercise it.
    branches: [main, t2/release-package]
    # EVERY input this workflow ships must be listed, or a change to it is committed, CI
    # stays green, and the next download quietly ships the old bytes - the exact silent
    # no-op class the ours-wins guard exists for. Audited 2026-08-28 against what the
    # jobs actually consume; keep this in sync when adding an input.
    paths:
      # Everything under packaging/ feeds this build: setup/ (the installer payload),
      # make-setup.ps1, make-iso.sh, stage-qwt-repo.ps1 (via qwt-full), the ours-wins
      # guard + its data file, and rpm/ (spec + dom0 scripts for the rpm job).
      - 'packaging/**'
      - '.github/workflows/release-package.yml'
      # Reused workflows ARE this build: jobs.msi calls qwt-full.yml, jobs.pv calls
      # pv-xenvif.yml. A change to either must rebuild the package.
      - '.github/workflows/qwt-full.yml'
      - '.github/workflows/pv-xenvif.yml'
      - '.github/workflows/pv-xencons.yml'
      - '.github/workflows/pv-xenbus.yml'
      # The ONE version generator: every OURS binary's FILEVERSION and the INF DriverVer come
      # out of it (packaging/version-stamp), so a change to it changes every shipped byte.
      - 'tools/stamp-version.ps1'
      # The artifact EMBEDS the driver and the agent (via qwt-full) - a change to either
      # must rebuild it, or the next download quietly ships stale binaries.
      - 'driver/**'
      # Submodule PATHS (a bump shows as a change to the path itself - .gitmodules is the
      # full set): agent = gui-agent binaries in the MSI; core-agent = the rpc overlay
      # swept into the payload and the guard's compiled-source checks.
      - 'agent'
      - 'core-agent'
      - '.gitmodules'
      # make-setup.ps1 stages guest/*.ps1 (activate-idd, deactivate-idd, the updater agent,
      # the desktop tweaks, VMExec) into the package. Without this filter a fix to one of
      # those scripts is committed, CI stays green, and the next download ships the old copy.
      - 'guest/**'
      # The stock-shape entry point is compiled here and staged into the package.
      - 'tools/qwt-bootstrap/**'
      # qubesdb-read.exe is compiled from here into tools\ of the package.
      - 'tools/qubesdb-read/**'
      # The user-session helpers are built by qwt-full and staged into the setup tree's bin\;
      # a source change to either must repackage or the shipped helper goes stale.
      - 'tools/notifhost/**'
      - 'tools/wgcbroker/**'
      # Shipped as compile-on-guest diagnostic source in tools\.
      - 'tools/winenum.cs'
      # pv-xenvif builds with these patches; the stock MSI + ITL certs come from vendor/.
      - 'patches/**'
      - 'vendor/**'
      # The rpm job packages the auto-qwt stub and README from contrib/.
      - 'contrib/**'

# One release build at a time, newest wins. Without this, a 2026-08-06 background job
# cancelled runs it took for duplicates and the cancellations looked like CI flakiness.
concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: true

# REPRODUCIBLE BUILDS: /Brepro makes link.exe write a CONTENT HASH into the PE header's
# TimeDateStamp instead of the wall-clock time of the build. Without it the same source
# commit produces a different binary on every run - measured on 2026-08-08, agent commit
# 03b1674c731f built gui-agent.exe as CBBD02069A01E047 once and BDA4615A891BFF3C later.
# That is not cosmetic: it means "same commit" does not imply "same artifact", so a release
# cannot be checked against the build that was actually tested, and a swapped binary would
# be indistinguishable from a rebuild.
# link.exe reads the LINK environment variable and prepends its contents to the command
# line, so setting it here covers every MSBuild/WDK invocation in this workflow without
# editing individual .vcxproj files.
# NOTE: this fixes the dominant cause, not every source of nondeterminism (absolute paths,
# PDB signatures and __DATE__/__TIME__ in sources can still vary). Treat reproducibility as
# verified only once two independent runs of the same commit are compared and match.
env:
  LINK: /Brepro
  # THE fourth FILEVERSION field for every OURS binary in this package (packaging/version-stamp).
  # One number, from this run, passed EXPLICITLY to the reusable workflows below (GITHUB_RUN_NUMBER
  # inside a reusable workflow is the caller's by accident of GitHub semantics, not by contract).
  # tools/stamp-version.ps1 THROWS in CI when this is unset, so every job that builds an OURS
  # binary must see it: this workflow-level env covers idd and setup; msi/pv/cons get build_rev.
  QWTNG_BUILD_REV: ${{ github.run_number }}

jobs:
  # ------------------------------------------------------------------ the MSI (reused)
  # qwt-full.yml builds installer.msi from the pinned upstream WiX sources with our agent
  # and uploads `qwt-full-package`. Calling it keeps ONE definition of that build.
  msi:
    uses: ./.github/workflows/qwt-full.yml
    secrets: inherit
    with:
      build_rev: ${{ github.run_number }}

  # --------------------------------------------------------------- the IddCx driver
  # Deliberately a slimmed copy of build.yml's idd-driver job: the release payload needs
  # the driver package (inf/cat/dll) plus devcon.exe - the /idd install path ACTIVATES
  # the driver by creating the root-enumerated device with it - and nothing else. The
  # console probes that job also builds are development tools and have no place in an
  # installable payload.
  idd:
    runs-on: windows-2022
    steps:
      - name: Require signing config
        shell: pwsh
        env:
          HAVE_PFX: ${{ secrets.SIGNING_PFX_B64 != '' }}
        run: |
          # An unsigned test driver cannot load even with testsigning on, so shipping one
          # would produce a package whose /idd path is guaranteed to fail on the guest.
          if ('${{ vars.SIGNING_ENABLED }}' -ne 'true' -or $env:HAVE_PFX -ne 'true') {
            throw 'release-package requires SIGNING_ENABLED=true and SIGNING_PFX_B64/PASS'
          }

      - uses: actions/checkout@v4
        with:
          # agent/version (in the agent submodule) is the ONE release version: the driver's
          # PreBuildEvent and the INF stamp below both read it. Without the submodule the
          # stamper fails BAD_VERSION_FILE before anything is built.
          submodules: true

      - name: Install WDK + VS driver targets
        shell: pwsh
        run: |
          choco install windowsdriverkit11 --no-progress -y
          $vsix = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix" -Recurse -Filter '*.vsix' |
                  Select-Object -First 1
          if (-not $vsix) { throw "WDK.vsix not found after choco install" }
          $inst = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Recurse -Filter VSIXInstaller.exe |
                  Select-Object -First 1
          Start-Process $inst.FullName -ArgumentList '/quiet', $vsix.FullName -Wait

      # The driver DLL's FILEVERSION is no longer stamped here: IddSampleDriver.vcxproj's
      # PreBuildEvent generates qidd_version.h from agent/version + QWTNG_BUILD_REV with the
      # repo's one stamper, so it reads the same <ver>.<rev> as every other OURS binary (the
      # per-minute counter this step used to write into a TRACKED header is gone; byte-uniqueness
      # per build is preserved because the run number differs per build).
      - name: Build driver
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild driver\ /m /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed" }

      - name: Collect driver package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force idd-package | Out-Null
          # The same recursive glob build.yml's idd-driver job uses, which is proven to
          # yield exactly one .inf and one .dll: the WDK scatters them across two
          # x64\Release trees (the stamped INF under driver\IddSampleDriver\x64\Release,
          # the binary under driver\x64\Release), so narrowing to a single "package
          # folder" finds one and misses the other.
          #
          # The pre-built .cat is deliberately NOT copied: Inf2Cat regenerates it below,
          # and shipping the stale one would mean a skipped Inf2Cat could go unnoticed.
          Get-ChildItem driver -Recurse -Include *.dll,*.inf |
              Where-Object FullName -match 'x64.*Release' |
              Copy-Item -Destination idd-package -Force
          $inf = @(Get-ChildItem idd-package -Filter *.inf)
          $dll = @(Get-ChildItem idd-package -Filter *.dll)
          if ($inf.Count -ne 1) { throw "expected 1 .inf in the driver package, got $($inf.Count)" }
          if ($dll.Count -lt 1) { throw 'no driver .dll produced' }
          Get-ChildItem idd-package | Format-Table Name, Length

      - name: Stamp INF DriverVer with the release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ONE implementation, two callers (was two copy-pasted epoch-minute blocks). Version =
          # agent/version + QWTNG_BUILD_REV via tools/stamp-version.ps1 -Print, so INF DriverVer,
          # the DLL's FILEVERSION and every other OURS binary read the identical <ver>.<rev>, and
          # activate-idd's bound-DriverVer == INF assertion now proves the RELEASE reached the device.
          # Stays in the 4.x space measured to work (21.x/23.x broke the WDDM compat parser, 2026-08-27).
          $inf = @(Get-ChildItem idd-package -Filter *.inf)
          if ($inf.Count -ne 1) { throw "expected exactly one .inf, got $($inf.Count)" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File packaging\version-stamp\stamp-inf-driverver.ps1 `
              -Inf $inf[0].FullName -VersionFile agent\version
          if ($LASTEXITCODE -ne 0) { throw 'INF stamp failed (see stamp-inf-driverver: FAIL line above)' }

      - name: Catalog + test-sign
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:PFX_B64))
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe |
              Where-Object FullName -match 'x64' | Select-Object -First 1
          $inf2cat = Get-ChildItem $kits -Recurse -Filter Inf2Cat.exe | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          if (-not $inf2cat)  { throw 'Inf2Cat.exe not found' }
          & $inf2cat.FullName /driver:idd-package /os:10_x64
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed ($LASTEXITCODE)" }
          Get-ChildItem idd-package -Include *.dll,*.cat -Recurse | ForEach-Object {
              & $signtool.FullName sign /fd sha256 /f cert.pfx /p $env:PFX_PASS $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($_.Name)" }
          }
          Remove-Item cert.pfx
          # A missing catalog means an INF that PnP will reject; fail here, not on the guest.
          if (-not (Get-ChildItem idd-package -Filter *.cat)) { throw 'no .cat produced' }
          Get-ChildItem idd-package | Format-Table Name, Length

      - name: Add devcon.exe from the WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # AFTER Inf2Cat/signing on purpose: devcon.exe is unreferenced by the INF, and
          # dropping it in earlier would put an unrelated binary in the directory the
          # catalog is generated from. Same WDK lookup as build.yml's idd-driver job,
          # preferring the x64 copy.
          $devcon = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Tools" -Recurse -Filter devcon.exe |
              Where-Object FullName -match 'x64' | Select-Object -First 1
          if (-not $devcon) {
            $devcon = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Tools" -Recurse -Filter devcon.exe |
                Select-Object -First 1
          }
          # install.cmd /idd now ACTIVATES the driver via `devcon install`; a release
          # package without devcon.exe would fail on every guest, so fail the job instead.
          if (-not $devcon) { throw 'devcon.exe not found under the WDK Tools directory - the /idd activation path depends on it' }
          Copy-Item $devcon.FullName idd-package\
          Write-Host "devcon.exe: $($devcon.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-idd-driver
          path: idd-package/
          retention-days: 14

  # ------------------------------------------------------------------ the setup tree
  pv:
    # The PV network fix. QWT 4.2.2's xenvif tops out at VIF REV_09000004 while its own
    # xennet requires REV_09000005, so the NET child never binds and the guest falls back
    # to the emulated Realtek. Built from xenbits master, which has rev 5 (4608bc1
    # "Use UNPLUG v3"). Proven on a clean guest: Realtek -> Xen PV Network Device #0.
    uses: ./.github/workflows/pv-xenvif.yml
    with:
      build_rev: ${{ github.run_number }}

  # The PV console. Not a feature - an instrument. Both wedges measured on 2026-08-29 killed
  # qrexec, window capture and the event log at the same instant, so nothing we own could see
  # in. `xl console` from dom0 depends on none of the three, but only if the driver is already
  # installed: a wedged guest cannot be given one afterwards. Hence: in the release package.
  cons:
    uses: ./.github/workflows/pv-xencons.yml
    with:
      build_rev: ${{ github.run_number }}

  # The PV bus driver, rebuilt from the commit Qubes pins plus the bucket-lock fix. The
  # prebuilt xenbus.sys in the MSI (byte-identical to stock 4.2.2's) carries a lock that can
  # leave a phantom writer bit and then spin forever at HIGH_LEVEL - the "guest never came
  # back" stall, proven from two register captures (findings/issues.md). Installed by pnputil
  # after the MSI with DriverVer 9.1.0.<run>, which outranks the MSI's 9.1.0.0.
  bus:
    uses: ./.github/workflows/pv-xenbus.yml
    with:
      build_rev: ${{ github.run_number }}

  setup:
    needs: [msi, idd, pv, cons, bus]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Download qwt-full artifact (installer.msi + our signed binaries + sign.crt)
        uses: actions/download-artifact@v4
        with:
          name: qwt-full-package
          path: dl/qwt-full

      - name: Download IddCx driver artifact
        uses: actions/download-artifact@v4
        with:
          name: release-idd-driver
          path: dl/idd

      - uses: actions/download-artifact@v4
        with:
          name: pv-xenvif
          path: dl/pv

      - uses: actions/download-artifact@v4
        with:
          name: pv-xencons
          path: dl/cons

      - uses: actions/download-artifact@v4
        with:
          name: pv-xenbus
          path: dl/bus

      # actions/checkout marks the workspace safe inside a TEMPORARY HOME and then restores
      # HOME, so by this point git reports "detected dubious ownership" and provenance
      # lookups silently degrade to 'unknown'. Resolve it here and hand it over explicitly.
      - name: Mark workspace safe for git
        shell: pwsh
        run: |
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE/agent"
          # core-agent too: the ours-wins guard diffs that submodule against its 4.2.2
          # base to prove compiled-source changes actually ship. Dubious-ownership there
          # would fail the CompiledSources check with a misleading message.
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE/core-agent"
          $repoSha = (git -C "$env:GITHUB_WORKSPACE" rev-parse HEAD).Trim()
          if (-not $repoSha) { throw 'could not resolve the repo SHA' }
          "QWT_REPO_SHA=$repoSha" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Locate vc_redist.x64.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The stock QWT Burn bundle installs the VC++ runtime as its prerequisite package;
          # we drive the MSI directly, so we must ship the runtime ourselves. The runner's
          # VS2022 redist copy is the same Microsoft-signed binary.
          $redist = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Recurse `
                    -Filter vc_redist.x64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $redist) { throw 'vc_redist.x64.exe not found on the runner' }
          # We are shipping a binary the guest will EXECUTE elevated, so assert Microsoft
          # actually signed it and it is untampered. Verified passing on run 31109691408.
          $sig = Get-AuthenticodeSignature $redist.FullName
          if ($sig.Status -ne 'Valid') { throw "vc_redist.x64.exe signature is $($sig.Status)" }
          Write-Host "$($redist.FullName)  signer: $($sig.SignerCertificate.Subject)"
          "VC_REDIST=$($redist.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The stock-shape entry point: a qubes-tools-<version>.exe at the package root, so the
      # tools are FOUND by anything that globs for the shape the vendor always shipped -
      # qvm-create-windows-qube's auto-qwt stub in particular, which otherwise matches nothing
      # against our installer tree and provisions a qube with no tools and no error.
      - name: Build the stock-shape entry point (qwt-bootstrap)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild tools\qwt-bootstrap\qwt-bootstrap.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "qwt-bootstrap msbuild failed" }
          $exe = Get-ChildItem tools\qwt-bootstrap -Recurse -Filter qwt-bootstrap.exe | Select-Object -First 1
          if (-not $exe) { throw 'qwt-bootstrap.exe not produced' }
          Write-Host $exe.FullName
          "BOOTSTRAP_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build qubesdb-read (guest-side reliable qubesdb CLI reader)
        shell: pwsh
        run: |
          # The stock qubesdb-cmd CLI mis-parses '/'-prefixed keys on Windows; this tiny tool reads
          # qubesdb correctly via the client DLL. Plain console exe, no core-qubesdb build dep.
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild tools\qubesdb-read\qubesdb-read.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "qubesdb-read msbuild failed" }
          $exe = Get-ChildItem tools\qubesdb-read -Recurse -Filter qubesdb-read.exe | Select-Object -First 1
          if (-not $exe) { throw 'qubesdb-read.exe not produced' }
          Write-Host $exe.FullName
          "QUBESDB_READ_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The two binaries THIS job builds were the only OURS PEs in the package that shipped
      # unsigned: qwt-full signs everything it builds, the idd job signs the driver, and these
      # two fell between. Same PFX as the idd job (:201-216 shape). BEFORE make-setup.ps1 on
      # purpose: it hashes what it stages, so a signature applied afterwards would invalidate
      # SHA256SUMS.txt and the self-check below would (correctly) fail.
      - name: Test-sign the setup-job binaries (qwt-bootstrap, qubesdb-read)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object FullName -match 'x64' | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          foreach ($f in @($env:BOOTSTRAP_EXE, $env:QUBESDB_READ_EXE)) {
            if (-not $f -or -not (Test-Path -LiteralPath $f)) { throw "setup-job binary to sign is missing: '$f'" }
            & $signtool.FullName sign /fd sha256 /f cert.pfx /p $env:PFX_PASS $f
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $f" }
            # The test cert is not trusted on the runner, so Status is never 'Valid' here; what is
            # asserted is that a signature by SOME signer is now present (NotSigned would mean
            # signtool exited 0 without writing one).
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) { throw "no Authenticode signature on $f after signing (status $($sig.Status))" }
            Write-Host "signed: $f  signer: $($sig.SignerCertificate.Subject)"
          }
          Remove-Item cert.pfx

      - name: Assemble qwt-improved-setup
        shell: pwsh
        run: |
          & .\packaging\make-setup.ps1 `
              -MsiArtifact dl\qwt-full `
              -IddArtifact dl\idd `
              -PvArtifact dl\pv `
              -ConsArtifact dl\cons `
              -BusArtifact dl\bus `
              -BootstrapExe "$env:BOOTSTRAP_EXE" `
              -VcRedist    "$env:VC_REDIST" `
              -QubesdbReadExe "$env:QUBESDB_READ_EXE" `
              -CoreAgentBins dl\qwt-full\core-agent-bins `
              -OutDir      qwt-improved-setup

      # THE OURS-WINS GUARD. Fails the build when any file this repo maintains a source
      # for would ship from the vendored stock 4.2.2 image - or not ship at all - instead
      # of from this repo (the 2026-08-25 silent no-op: an edit to a core-agent rpc script
      # reached no guest while CI stayed green). Data-driven from packaging/ours-wins.psd1;
      # extracts the stock MSI as its comparison baseline and cross-checks the assembled
      # tree, the repo sources, and the core-agent submodule's diff against its 4.2.2 base.
      # The guard checks TWO channels, so it needs both roots. The payload tree it gets from
      # -PackageRoot; the MSI's own contents have to be extracted, because "our file is in the
      # setup tree" and "our file is inside the MSI that actually installs" are different claims
      # and the second is the one the guest experiences. Extract our BUILT MSI the same way the
      # stock baseline is extracted.
      - name: Extract our built MSI (admin image for the guard)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Resolve-Path 'qwt-improved-setup\msi\installer.msi'
          $out = Join-Path $env:RUNNER_TEMP 'qwt-built-image'
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed on our MSI: $($p.ExitCode)" }
          $n = @(Get-ChildItem $out -Recurse -File).Count
          Write-Host "built MSI image: $n files"
          if ($n -lt 60) { throw "built MSI image implausibly small ($n files)" }
          "BUILT_MSI_IMAGE=$out" | Out-File -Append $env:GITHUB_ENV

      - name: Guard - everything we maintain must ship from this repo (ours-wins)
        shell: pwsh
        run: |
          & .\packaging\check-ours-wins.ps1 `
              -RepoRoot . `
              -PackageRoot qwt-improved-setup `
              -StockMsi vendor\qwt-4.2.2\installer.msi `
              -MsiImage $env:BUILT_MSI_IMAGE

      - name: Show manifest
        shell: pwsh
        run: Get-Content qwt-improved-setup\MANIFEST.json

      - name: Self-check the staged tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Re-verify SHA256SUMS.txt the same way the guest installer will, and assert the
          # payload really is present. A packaging job whose only check is "msbuild exited 0"
          # cannot fail on a dropped file.
          $root = (Resolve-Path qwt-improved-setup).Path
          $lines = @(Get-Content "$root\SHA256SUMS.txt" | Where-Object { $_.Trim() })
          $bad = @()
          foreach ($l in $lines) {
            if (-not ($l -match '^([0-9a-f]{64})\s+(.+)$')) { throw "malformed sums line: $l" }
            $p = Join-Path $root ($Matches[2] -replace '/', '\')
            if (-not (Test-Path -LiteralPath $p)) { $bad += "MISSING $($Matches[2])"; continue }
            $h = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($h -ne $Matches[1]) { $bad += "MISMATCH $($Matches[2])" }
          }
          if ($bad.Count) { throw ($bad -join "`n") }
          foreach ($req in 'install.cmd','Install-QwtImproved.ps1','README.txt','MANIFEST.json',
                           'msi\installer.msi','msi\vc_redist.x64.exe',
                           'certs\qwt-improved-testsign.cer',
                           'pvnic-selfprime.ps1','qubesdb-read.ps1','tools\qubesdb-read.exe') {
            if (-not (Test-Path -LiteralPath "$root\$req")) { throw "staged tree is missing $req" }
          }
          if (@(Get-ChildItem "$root\certs" -Filter *.cer).Count -ne 7) {
            throw 'expected 7 certificates (6 ITL + ours) in certs\'
          }
          if (-not (Get-ChildItem "$root\idd-driver" -Filter *.cat)) {
            throw 'idd-driver\ has no catalog - the driver payload would not install'
          }
          if (-not (Test-Path -LiteralPath "$root\idd-driver\devcon.exe")) {
            throw 'idd-driver\ has no devcon.exe - install.cmd /idd could not create the IDD device'
          }
          Write-Host "self-check OK: $($lines.Count) files verified"

      - name: Syntax-check every staged PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Parse (do not run) every .ps1 that will execute on the guest. A syntax error here is
          # otherwise discovered only after someone boots a VM. Covers pvnic-selfprime.ps1 whose
          # nested here-string (a double-quoted Add-Type block inside the single-quoted per-boot
          # payload) is exactly the kind of thing that parses on one host and breaks on another.
          $root = (Resolve-Path 'qwt-improved-setup').Path
          $fail = 0
          foreach ($f in Get-ChildItem -Path $root -Recurse -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count) {
              Write-Host "PARSE ERRORS in $($f.Name):"
              $errors | ForEach-Object { Write-Host "  $_" }
              $fail += $errors.Count
            } else {
              Write-Host "  ok: $($f.Name)"
            }
          }
          if ($fail) { throw "$fail parse error(s) across staged .ps1 scripts" }
          Write-Host 'all staged .ps1 scripts parse clean'

      - uses: actions/upload-artifact@v4
        with:
          name: qwt-improved-setup
          path: qwt-improved-setup/
          retention-days: 14

  # ------------------------------------------------------------------------- the ISO
  iso:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the staged setup tree
        uses: actions/download-artifact@v4
        with:
          name: qwt-improved-setup
          path: qwt-improved-setup

      - name: Install xorriso
        # THIRD-PARTY APT LISTS ARE DROPPED FIRST. The GitHub runner image ships extra sources
        # (google-chrome, microsoft-prod, ...) that this job does not use, and `apt-get update`
        # fails the WHOLE step when any one of them serves a bad index. That is not hypothetical:
        # run 34384073456 - a release build whose every code job had already succeeded - failed the
        # ISO on "Failed to fetch .../chrome-stable/... Hash Sum mismatch", so an unrelated vendor
        # repo blocked a release. xorriso comes from the Ubuntu archive; nothing here needs those.
        run: |
          # Update ONLY the main archive: sourceparts=/dev/null ignores every /etc/apt/sources.list.d
          # entry. Matching those by FILENAME was tried first and did not work - the runner image
          # carries the Chrome repo as a deb822 .sources file, not a *chrome*.list - which is the
          # usual lesson that a name match is not a content match. This needs no such guess.
          sudo apt-get update -qq -o Dir::Etc::sourceparts=/dev/null -o APT::Get::List-Cleanup=0
          sudo apt-get install -y -qq xorriso
          xorriso -version | head -1

      - name: Build + verify the ISO
        env:
          VOLID: ${{ github.event.inputs.volume_id || 'QWT_IMPROVED' }}
        run: |
          set -euo pipefail
          # upload-artifact does not preserve the executable bit for .sh files it never saw;
          # this one comes from the checkout, but be explicit anyway.
          chmod +x packaging/make-iso.sh
          mkdir -p iso-out
          ./packaging/make-iso.sh qwt-improved-setup iso-out/qwt-improved-setup.iso "$VOLID"

      - name: MANIFEST for the ISO artifact
        env:
          VOLID: ${{ github.event.inputs.volume_id || 'QWT_IMPROVED' }}
        run: |
          set -euo pipefail
          python3 - "$VOLID" <<'PY'
          import hashlib, json, os, sys
          volid = sys.argv[1]
          iso = 'iso-out/qwt-improved-setup.iso'
          with open('qwt-improved-setup/MANIFEST.json', encoding='utf-8-sig') as f:
              m = json.load(f)
          h = hashlib.sha256()
          with open(iso, 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''):
                  h.update(chunk)
          # Same manifest as the setup artifact (commit, run id, per-file sha256) plus the
          # image's own identity, so the ISO artifact is self-describing on its own.
          m['package'] = 'qwt-improved-iso'
          m['iso'] = {
              'name': os.path.basename(iso),
              'size': os.path.getsize(iso),
              'sha256': h.hexdigest(),
              'volume_id': volid,
              'contents_root': '/',
              'note': 'ISO 9660 + Joliet + Rock Ridge, not bootable. Attach as a CD and run install.cmd elevated.',
          }
          with open('iso-out/MANIFEST.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, indent=2)
          with open('iso-out/SHA256SUMS.txt', 'w', encoding='ascii') as f:
              f.write('%s  %s\n' % (h.hexdigest(), os.path.basename(iso)))
          print(json.dumps(m['iso'], indent=2))
          PY

      - name: Copy the README next to the ISO
        run: cp qwt-improved-setup/README.txt iso-out/README.txt

      - name: Artifact contents
        run: ls -l iso-out && cat iso-out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qwt-improved-iso
          path: iso-out/
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # dom0 RPM: drops the ISO at /usr/lib/qubes/qubes-windows-tools.iso, the path Qubes'
  # provisioning tooling already looks for. qvm-create-windows-qube checks that exact path
  # and, on Qubes 4.3, tells the user to build Windows Tools themselves and put it there -
  # so this package is a drop-in for a gap upstream explicitly leaves open.
  #
  # noarch and contentless-by-build: the ISO is produced by the `iso` job and passed in as a
  # source, so this job never rebuilds Windows binaries. It only packages them.
  rpm:
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: qwt-improved-iso
          path: dl/iso

      - name: Install rpm tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Verify the ISO before packaging it
        run: |
          set -euo pipefail
          iso=dl/iso/qwt-improved-setup.iso
          [ -f "$iso" ] || { echo "::error::no ISO in the artifact"; ls -R dl/iso; exit 1; }
          # The ISO ships its own SHA256SUMS; re-check it here rather than trusting the
          # artifact round-trip. A silently truncated download would otherwise be packaged
          # into an RPM and shipped.
          ( cd dl/iso && sha256sum -c SHA256SUMS.txt )
          # And prove the thing we are shipping actually contains the installer entry point,
          # because an ISO that mounts but has no install.cmd fails SILENTLY in
          # qvm-create-windows-qube (its glob matches nothing, no error is raised).
          sudo mkdir -p /mnt/qwtiso
          sudo mount -o loop,ro "$iso" /mnt/qwtiso
          for f in install.cmd Install-QwtImproved.ps1 msi/installer.msi MANIFEST.json; do
            [ -e "/mnt/qwtiso/$f" ] || { echo "::error::ISO is missing $f"; sudo umount /mnt/qwtiso; exit 1; }
          done
          echo "ISO contents verified:"; ls /mnt/qwtiso
          cp /mnt/qwtiso/MANIFEST.json dl/MANIFEST.json
          sudo umount /mnt/qwtiso

      - name: Derive the package version from the manifest
        id: ver
        run: |
          set -euo pipefail
          # RPM versions may not contain '-' or '+'; the manifest carries e.g.
          # 4.3.0+agent.<sha> (package_version from make-setup.ps1). Use the part before
          # '+' as Version and encode the agent commit in the Release field so the RPM is
          # traceable to the exact build without smuggling an illegal character into Version.
          agent=$(python3 -c "import json;print(json.load(open('dl/MANIFEST.json'))['source']['agent_commit'][:12])")
          ver=$(python3 -c "import json;print(json.load(open('dl/MANIFEST.json'))['package_version'].split('+')[0])")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "release=1.agent$agent" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "QWT-NG $ver-1.agent$agent"

      - name: Build the RPM
        run: |
          set -euo pipefail
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          cp dl/iso/qwt-improved-setup.iso            ~/rpmbuild/SOURCES/
          cp contrib/auto-qwt/install-qwt.bat         ~/rpmbuild/SOURCES/
          cp contrib/auto-qwt/qwt-ng-fix-qwcq         ~/rpmbuild/SOURCES/
          cp contrib/README-qvm-create-windows-qube.md ~/rpmbuild/SOURCES/
          cp packaging/rpm/qvm-windows-update          ~/rpmbuild/SOURCES/
          cp packaging/rpm/qwt-ng-prepare-qube        ~/rpmbuild/SOURCES/
          cp dl/MANIFEST.json                          ~/rpmbuild/SOURCES/
          cp packaging/rpm/qubes-windows-tools-ng.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/qubes-windows-tools-ng.spec \
            --define "_qwtng_version ${{ steps.ver.outputs.version }}" \
            --define "_qwtng_release ${{ steps.ver.outputs.release }}" \
            --define "dist %{nil}" \
            --define "_rpmfilename %%{NAME}-%%{VERSION}-%%{RELEASE}.%%{ARCH}.rpm"
          mkdir -p rpm-out
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} rpm-out/ \;
          ls -l rpm-out

      - name: Verify the RPM lands the ISO where the tooling looks for it
        run: |
          set -euo pipefail
          rpm=$(ls rpm-out/*.rpm | head -1)
          echo "== payload =="; rpm -qlp "$rpm"
          # The whole point of this package is one path. Assert it rather than eyeballing it.
          rpm -qlp "$rpm" | grep -qx '/usr/lib/qubes/qubes-windows-tools.iso' \
            || { echo "::error::RPM does not install the ISO at the path qvm-create-windows-qube reads"; exit 1; }
          rpm -qlp "$rpm" | grep -q 'auto-qwt/install-qwt.bat' \
            || { echo "::error::RPM is missing the qvm-create-windows-qube installer stub"; exit 1; }
          # Conflicts must be declared, or installing this would silently replace a signed
          # vendor ISO with a test-signed one.
          rpm -qp --conflicts "$rpm" | grep -q 'qubes-windows-tools' \
            || { echo "::error::RPM does not declare Conflicts: qubes-windows-tools"; exit 1; }
          echo "== metadata =="; rpm -qip "$rpm"
          sha256sum rpm-out/*.rpm | tee rpm-out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qwt-ng-dom0-rpm
          path: rpm-out/
          retention-days: 14
