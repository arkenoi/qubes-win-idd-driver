# GitHub Actions: build the IddCx driver (Track B) and the patched gui-agent (Track A).
# Goes to .github/workflows/build.yml in the driver repo (bootstrap-repo.sh places it).
#
# NOTE: the WDK-install recipe below is the standard OSS pattern (choco WDK + WDK.vsix into
# VS2022) but versions drift — converging this on the first run is Phase 0 of CLAUDE.md.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Track B: IddCx driver
  idd-driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK + VS driver targets
        shell: pwsh
        run: |
          choco install windowsdriverkit11 --no-progress -y
          $vsix = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix" -Recurse -Filter '*.vsix' |
                  Select-Object -First 1
          if (-not $vsix) { throw "WDK.vsix not found after choco install" }
          $inst = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Recurse -Filter VSIXInstaller.exe |
                  Select-Object -First 1
          Start-Process $inst.FullName -ArgumentList '/quiet', $vsix.FullName -Wait

      - name: Stamp DLL version (unique per build)
        shell: pwsh
        run: |
          # Two consecutive releases built from unchanged driver source produce BYTE-IDENTICAL
          # DLLs; installing such a pair leaves System32\drivers\UMDF hardlinked to the OLD
          # store generation and the device never starts cleanly (FINDINGS 2026-08-27, the
          # withdrawn 4.3.8). A per-minute FILEVERSION makes every build byte-unique.
          $epochMin = [int][Math]::Floor(([DateTimeOffset]::UtcNow - [DateTimeOffset]::new(2026,1,1,0,0,0,[TimeSpan]::Zero)).TotalMinutes)
          $build = ($epochMin -shr 16) -band 0x7FFF
          $rev = $epochMin -band 0xFFFF
          $ver = "4.3.$build.$rev"
          $h = "#pragma once`n#define QIDD_VER_MAJOR 4`n#define QIDD_VER_MINOR 3`n#define QIDD_VER_BUILD $build`n#define QIDD_VER_REV $rev`n#define QIDD_VER_STR `"$ver`"`n"
          Set-Content driver/IddSampleDriver/qidd_version.h $h
          Get-Content driver/IddSampleDriver/qidd_version.h

      - name: Build driver
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild driver\ /m /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed" }

      - name: Build ddaprobe
        shell: pwsh
        run: |
          # tools/ddaprobe: Desktop Duplication scoping probe (CLAUDE.md Phase 0.6 / 1B).
          # Plain v143 toolset + /MT, no WDK dependency -> its own msbuild invocation.
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild tools\ddaprobe\ddaprobe.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "ddaprobe msbuild failed" }
          Get-ChildItem tools\ddaprobe\x64\Release\ddaprobe.exe

      - name: Build chromerepro
        shell: pwsh
        run: |
          # tools/chromerepro: reproduces the Office 2013+ compound-window layout WITHOUT
          # Office, so the 2A-chrome predicate can be tested (CLAUDE.md Phase 2A-chrome).
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild tools\chromerepro\chromerepro.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "chromerepro msbuild failed" }
          Get-ChildItem tools\chromerepro\x64\Release\chromerepro.exe

      - name: Build modeprobe
        shell: pwsh
        run: |
          # tools/modeprobe: display-mode witness (PLAN-trackb-t2-modes.md section 3 A0).
          # Enumerates every display device's mode list + current mode, CDS_TESTs or
          # applies a requested size, JSON out. Plain v143 + /MT, no WDK dependency.
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild tools\modeprobe\modeprobe.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "modeprobe msbuild failed" }
          Get-ChildItem tools\modeprobe\x64\Release\modeprobe.exe

      - name: Build pwprobe
        shell: pwsh
        run: |
          # tools/pwprobe: Gate 0 of the per-window-capture feasibility session — does
          # PrintWindow(PW_RENDERFULLCONTENT) return correct content for an occluded window?
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild tools\pwprobe\pwprobe.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "pwprobe msbuild failed" }
          Get-ChildItem tools\pwprobe\x64\Release\pwprobe.exe

      - name: Build wgcprobe
        shell: pwsh
        run: |
          # tools/wgcprobe: Windows.Graphics.Capture probes (per-window-capture Q3/Q4).
          # C++/WinRT from the Windows SDK; plain v143, no WDK.
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild tools\wgcprobe\wgcprobe.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "wgcprobe msbuild failed" }
          Get-ChildItem tools\wgcprobe\x64\Release\wgcprobe.exe

      - name: Build qubesdb-read
        shell: pwsh
        run: |
          # tools/qubesdb-read: guest-side reliable qubesdb reader (stock qubesdb-cmd mis-parses
          # '/'-prefixed keys). Plain v143 console exe, LoadLibrary's qubesdb-client.dll at runtime.
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
              Select-Object -First 1
          & $msbuild tools\qubesdb-read\qubesdb-read.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "qubesdb-read msbuild failed" }
          Get-ChildItem tools\qubesdb-read\x64\Release\qubesdb-read.exe

      - name: Collect package + tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          # driver binaries + INF (path depends on the project; sample outputs under x64\Release)
          # *.exe included so IddSampleApp.exe ships: it is what actually ACTIVATES an IDD
          # monitor (SwDeviceCreate on hardware id "IddSampleDriver", the INF's 2nd models
          # line). Without it the driver installs but drives no monitor, and the Phase 1B
          # gate can only be measured connected-but-inactive.
          Get-ChildItem driver -Recurse -Include *.dll,*.inf,*.cat,*.exe |
              Where-Object FullName -match 'x64.*Release' |
              Copy-Item -Destination package -Force
          # devcon.exe for root-enumerated device creation in the guest
          $devcon = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Tools" -Recurse -Filter devcon.exe |
              Where-Object FullName -match 'x64' | Select-Object -First 1
          if ($devcon) { Copy-Item $devcon.FullName package\ }
          Get-ChildItem package

      - name: Pin INF DriverVer version (never a time-of-day number)
        shell: pwsh
        run: |
          # stampinf's default writes the BUILD TIME as the DriverVer VERSION (HH.MM.SS.ms).
          # Versions with leading fields like 21.x / 23.x land in the WDDM driver-version
          # encoding space that graphics-stack compat logic parses - measured 2026-08-27:
          # packages versioned 21.22.* and 23.53.* never surface the registry modes and
          # reject the QIDD ioctl, while 15.51.* and 8.1.* work, SAME BYTES. So releases
          # built in the evening were broken and morning builds worked. Pin to 4.3.min.rev.
          $inf = Get-ChildItem package -Filter *.inf | Select-Object -First 1
          $epochMin = [int][Math]::Floor(([DateTimeOffset]::UtcNow - [DateTimeOffset]::new(2026,1,1,0,0,0,[TimeSpan]::Zero)).TotalMinutes)
          $build = ($epochMin -shr 16) -band 0x7FFF
          $rev = $epochMin -band 0xFFFF
          $date = (Get-Date).ToUniversalTime().ToString('MM/dd/yyyy')
          $txt = Get-Content $inf.FullName -Raw -Encoding Unicode
          $txt = $txt -replace 'DriverVer\s*=\s*[^\r\n]+', "DriverVer = $date,4.3.$build.$rev"
          Set-Content $inf.FullName $txt -Encoding Unicode
          Select-String -Path $inf.FullName -Pattern DriverVer -Encoding Unicode | ForEach-Object Line

      - name: Test-sign package
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASS }}
        run: |
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:PFX_B64))
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe |
              Where-Object FullName -match 'x64' | Select-Object -First 1
          $inf2cat = Get-ChildItem $kits -Recurse -Filter Inf2Cat.exe | Select-Object -First 1
          & $inf2cat.FullName /driver:package /os:10_x64
          Get-ChildItem package -Include *.dll,*.cat -Recurse | ForEach-Object {
              & $signtool.FullName sign /fd sha256 /f cert.pfx /p $env:PFX_PASS $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($_.Name)" }
          }
          Remove-Item cert.pfx

      # After signing on purpose: ddaprobe.exe is a user-mode console tool, unreferenced by
      # any INF; dropping it in before Inf2Cat would put an unrelated binary in the dir the
      # catalog is generated from.
      - name: Add unsigned tools to package
        shell: pwsh
        run: |
          $probe = Get-ChildItem tools\ddaprobe -Recurse -Filter ddaprobe.exe -ErrorAction SilentlyContinue |
              Where-Object FullName -match 'x64.*Release' | Select-Object -First 1
          if ($probe) { Copy-Item $probe.FullName package\ -Force } else { Write-Warning 'ddaprobe.exe missing from package' }
          $repro = Get-ChildItem tools\chromerepro -Recurse -Filter chromerepro.exe -ErrorAction SilentlyContinue |
              Where-Object FullName -match 'x64.*Release' | Select-Object -First 1
          if ($repro) { Copy-Item $repro.FullName package\ -Force } else { Write-Warning 'chromerepro.exe missing from package' }
          $mode = Get-ChildItem tools\modeprobe -Recurse -Filter modeprobe.exe -ErrorAction SilentlyContinue |
              Where-Object FullName -match 'x64.*Release' | Select-Object -First 1
          if ($mode) { Copy-Item $mode.FullName package\ -Force } else { Write-Warning 'modeprobe.exe missing from package' }
          $pw = Get-ChildItem tools\pwprobe -Recurse -Filter pwprobe.exe -ErrorAction SilentlyContinue |
              Where-Object FullName -match 'x64.*Release' | Select-Object -First 1
          if ($pw) { Copy-Item $pw.FullName package\ -Force } else { Write-Warning 'pwprobe.exe missing from package' }
          $wgc = Get-ChildItem tools\wgcprobe -Recurse -Filter wgcprobe.exe -ErrorAction SilentlyContinue |
              Where-Object FullName -match 'x64.*Release' | Select-Object -First 1
          if ($wgc) { Copy-Item $wgc.FullName package\ -Force } else { Write-Warning 'wgcprobe.exe missing from package' }
          $qdbr = Get-ChildItem tools\qubesdb-read -Recurse -Filter qubesdb-read.exe -ErrorAction SilentlyContinue |
              Where-Object FullName -match 'x64.*Release' | Select-Object -First 1
          if ($qdbr) { Copy-Item $qdbr.FullName package\ -Force } else { Write-Warning 'qubesdb-read.exe missing from package' }
          Get-ChildItem package

      - uses: actions/upload-artifact@v4
        with:
          name: idd-driver-package
          path: package/
          retention-days: 14   # keep private-tier artifact storage (500 MB) comfortable

  # ------------------------------------------- Track A: patched qubes-gui-agent-windows
  # Pure user-mode build: VS2022 v143 + Windows SDK only. NO WDK, NO EWDK. Convergence
  # per ci-notes/trackA-build.md. Enable via repo variable AGENT_BUILD=true.
  gui-agent:
    if: ${{ vars.AGENT_BUILD == 'true' }}
    runs-on: windows-2022
    env:
      CONFIG: Release
      # Pinned to the versions QWT 4.2.2 installed in win-idd-test (read off the live guest).
      WINDOWS_UTILS_REF: v4.2.2
      VCHAN_REF: v4.2.7
      QUBESDB_REF: v4.3.1
      PVDRIVERS_REF: v4.2.0-1
      XENIFACE_SHA: 9cd9a604191bf26da18b564d1686e4ee0ccf3d32
      GUI_COMMON_REF: v4.3.1     # >= v4.3.1: earlier tags don't compile under MSVC
      BUILDERV2_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate MSBuild and lib.exe
        id: vs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild `
                       -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $vsroot  = & $vswhere -latest -property installationPath
          $tv      = (Get-Content "$vsroot\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $lib     = "$vsroot\VC\Tools\MSVC\$tv\bin\Hostx64\x64\lib.exe"
          if (-not (Test-Path $msbuild)) { throw "MSBuild.exe not found" }
          if (-not (Test-Path $lib)) { throw "lib.exe not found: $lib" }
          "msbuild=$msbuild" | Out-File -Append $env:GITHUB_OUTPUT
          "lib=$lib"         | Out-File -Append $env:GITHUB_OUTPUT

      - name: Fetch Qubes dependency sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Clone($url, $ref, $dir) {
            git clone --quiet --depth 1 --branch $ref -c advice.detachedHead=false $url $dir
            if ($LASTEXITCODE -ne 0) { throw "clone failed: $url @ $ref" }
          }
          Clone https://github.com/QubesOS/qubes-windows-utils.git             $env:WINDOWS_UTILS_REF deps-src/windows-utils
          Clone https://github.com/QubesOS/qubes-core-vchan-xen.git            $env:VCHAN_REF         deps-src/core-vchan-xen
          Clone https://github.com/QubesOS/qubes-core-qubesdb.git              $env:QUBESDB_REF       deps-src/core-qubesdb
          Clone https://github.com/QubesOS/qubes-gui-common.git                $env:GUI_COMMON_REF    deps-src/gui-common
          Clone https://github.com/QubesOS/qubes-vmm-xen-windows-pvdrivers.git $env:PVDRIVERS_REF     deps-src/pvdrivers
          Clone https://github.com/QubesOS/qubes-builderv2.git                 $env:BUILDERV2_REF     deps-src/builderv2
          git clone --quiet --no-checkout https://xenbits.xen.org/git-http/pvdrivers/win/xeniface.git deps-src/pvdrivers/xeniface
          if ($LASTEXITCODE -ne 0) { throw "xeniface clone failed" }
          git -C deps-src/pvdrivers/xeniface fetch --quiet --depth 1 origin $env:XENIFACE_SHA
          if ($LASTEXITCODE -ne 0) { throw "xeniface fetch failed" }
          git -C deps-src/pvdrivers/xeniface checkout --quiet FETCH_HEAD
          if (-not (Test-Path deps-src/pvdrivers/xeniface/include/xencontrol.h)) { throw "xencontrol.h missing after checkout" }

      - name: Synthesize xencontrol import library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "deps-src\pvdrivers\xeniface\vs2022\x64\Windows10$env:CONFIG"
          New-Item -ItemType Directory -Force $out | Out-Null
          # Array form (not a here-string): avoids the YAML block-scalar indentation trap.
          $def = @(
            'LIBRARY xencontrol.dll','EXPORTS',
            'XcClose','XcEvtchnBindInterdomain','XcEvtchnClose','XcEvtchnNotify',
            'XcEvtchnOpenUnbound','XcEvtchnUnmask','XcGnttabMapForeignPages',
            'XcGnttabPermitForeignAccess','XcGnttabPermitForeignAccess2',
            'XcGnttabRevokeForeignAccess','XcGnttabUnmapForeignPages','XcOpen',
            'XcRegisterLogger','XcSetLogLevel','XcStoreAddWatch','XcStoreDirectory',
            'XcStoreRead','XcStoreRemove','XcStoreRemoveWatch','XcStoreSetPermissions',
            'XcStoreWrite')
          $def | Set-Content -Encoding ascii "$out\xencontrol.def"
          & "${{ steps.vs.outputs.lib }}" /nologo /machine:x64 /def:"$out\xencontrol.def" /out:"$out\xencontrol.lib"
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed building xencontrol.lib" }

      - name: Build grantprobe
        shell: pwsh
        run: |
          # tools/grantprobe: guest-side grant ceiling/latency probe (per-window-capture
          # Q2). Lives in THIS job because it links the xencontrol import library
          # synthesized in the previous step.
          $ErrorActionPreference = 'Stop'
          $ws = "${{ github.workspace }}"
          & "${{ steps.vs.outputs.msbuild }}" tools\grantprobe\grantprobe.vcxproj `
              -nologo -m -v:minimal -p:Platform=x64 "-p:Configuration=$env:CONFIG" `
              "-p:XenIncludes=$ws\deps-src\pvdrivers\xeniface\include" `
              "-p:XenLibs=$ws\deps-src\pvdrivers\xeniface\vs2022\x64\Windows10$env:CONFIG"
          if ($LASTEXITCODE -ne 0) { throw "grantprobe msbuild failed" }
          Get-ChildItem tools\grantprobe\x64\Release\grantprobe.exe

      - name: Build Qubes user-mode dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws      = "${{ github.workspace }}"
          $msbuild = "${{ steps.vs.outputs.msbuild }}"
          $cfg     = $env:CONFIG
          $env:QUBES_REPO  = "$ws\qubes-repo"
          $env:QB_SCRIPTS  = "$ws\deps-src\builderv2\qubesbuilder\plugins\build_windows\scripts"
          # BLOCKER FIX D1: libvchan.vcxproj / qubesdb-client.vcxproj resolve their staged
          # deps ONLY through $(QUBES_INCLUDES)/$(QUBES_LIBS), not $(QUBES_REPO)\...\{inc,lib}.
          # Rebuild those two env vars from every <comp>\{inc,lib} after each Stage, exactly
          # like build-sln.ps1 does, or the later dep builds fail C1083/LNK1104.
          function Refresh-QubesEnv {
            $inc=@(); $lib=@()
            Get-ChildItem $env:QUBES_REPO -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              if (Test-Path "$($_.FullName)\inc") { $inc += "$($_.FullName)\inc" }
              if (Test-Path "$($_.FullName)\lib") { $lib += "$($_.FullName)\lib" }
            }
            $env:QUBES_INCLUDES = ($inc -join ';')
            $env:QUBES_LIBS     = ($lib -join ';')
          }
          function MB([string]$proj, [string]$target) {
            $a = @($proj, '-nologo', '-m', '-v:minimal', "-p:Platform=x64", "-p:Configuration=$cfg")
            if ($target) { $a += "-t:$target" }
            & $msbuild @a
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed: $proj $target" }
          }
          function Stage([string]$comp, [string[]]$inc, [string[]]$lib) {
            New-Item -ItemType Directory -Force "$env:QUBES_REPO\$comp\inc" | Out-Null
            New-Item -ItemType Directory -Force "$env:QUBES_REPO\$comp\lib" | Out-Null
            $inc | ForEach-Object { Copy-Item $_ "$env:QUBES_REPO\$comp\inc\" -Force }
            # Locate each .lib rather than trusting one hardcoded OutDir: building a
            # .vcxproj DIRECTLY roots $(SolutionDir)-based OutDirs at the project dir
            # (vs2022\libxenvchan\x64\...) instead of the solution dir (vs2022\x64\...).
            # Search the component tree for the exact filename, newest wins.
            $lib | ForEach-Object {
              $want = Split-Path $_ -Leaf
              $src  = $_
              if (-not (Test-Path $src)) {
                # walk up to the component root and search for it
                $root = $src
                while ($root -and -not (Test-Path (Join-Path $root '.git')) -and (Split-Path $root -Parent)) {
                  $root = Split-Path $root -Parent
                }
                if (-not $root) { $root = "$ws\deps-src" }
                $hit = Get-ChildItem $root -Recurse -Filter $want -ErrorAction SilentlyContinue |
                       Where-Object FullName -match "x64\\$cfg" |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if (-not $hit) { throw "cannot locate $want under $root after building $comp" }
                $src = $hit.FullName
                Write-Host "  (located $want at $src)"
              }
              Copy-Item $src "$env:QUBES_REPO\$comp\lib\" -Force
            }
            Refresh-QubesEnv
          }

          # Build the libxenvchan PROJECT directly, NOT the .sln: the solution's sibling
          # pvdrivers.vcxproj has a custom build step that compiles the KMDF drivers
          # (xenbus/xeniface/xenvbd/xenvif/xennet via build.ps1) and needs the WDK/EWDK we
          # deliberately don't have -> MSB3073. The .vcxproj alone is pure user-mode.
          MB "$ws\deps-src\pvdrivers\vs2022\libxenvchan\libxenvchan.vcxproj" ''
          Stage 'vmm-xen-windows-pvdrivers' `
            @("$ws\deps-src\pvdrivers\include\libxenvchan.h",
              "$ws\deps-src\pvdrivers\include\libxenvchan_ring.h",
              "$ws\deps-src\pvdrivers\xeniface\include\xencontrol.h",
              "$ws\deps-src\pvdrivers\xeniface\include\xeniface_ioctls.h") `
            @("$ws\deps-src\pvdrivers\vs2022\x64\$cfg\libxenvchan\libxenvchan.lib",
              "$ws\deps-src\pvdrivers\xeniface\vs2022\x64\Windows10$cfg\xencontrol.lib")

          MB "$ws\deps-src\core-vchan-xen\windows\vs2022\core-vchan-xen.sln" 'libvchan'
          Stage 'core-vchan-xen' `
            @("$ws\deps-src\core-vchan-xen\windows\include\libvchan.h") `
            @("$ws\deps-src\core-vchan-xen\windows\vs2022\x64\$cfg\libvchan\libvchan.lib")

          MB "$ws\deps-src\windows-utils\vs2022\windows-utils.sln" ''
          Stage 'windows-utils' `
            @(Get-ChildItem "$ws\deps-src\windows-utils\include\*.h" | % FullName) `
            @("$ws\deps-src\windows-utils\vs2022\x64\$cfg\windows-utils\windows-utils.lib")

          MB "$ws\deps-src\core-qubesdb\windows\vs2022\core-qubesdb.sln" 'qubesdb-client'
          Stage 'core-qubesdb' `
            @("$ws\deps-src\core-qubesdb\include\qubesdb.h",
              "$ws\deps-src\core-qubesdb\include\qubesdb-client.h") `
            @("$ws\deps-src\core-qubesdb\windows\vs2022\x64\$cfg\qubesdb-client\qubesdb-client.lib")
          "QUBES_INCLUDES=$env:QUBES_INCLUDES" | Out-File -Append $env:GITHUB_ENV
          "QUBES_LIBS=$env:QUBES_LIBS"         | Out-File -Append $env:GITHUB_ENV
          "QUBES_REPO=$env:QUBES_REPO"         | Out-File -Append $env:GITHUB_ENV

      - name: Build gui-agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws  = "${{ github.workspace }}"
          $env:QB_SCRIPTS = "$ws\deps-src\builderv2\qubesbuilder\plugins\build_windows\scripts"
          # gui-common headers (qubes-gui-protocol.h) go FIRST, then the staged dep incs
          # carried over via $GITHUB_ENV from the previous step.
          $env:QUBES_INCLUDES = "$ws\deps-src\gui-common\include;" + $env:QUBES_INCLUDES
          & "${{ steps.vs.outputs.msbuild }}" "$ws\agent\vs2022\gui-agent-windows.sln" `
              -nologo -m -v:minimal -p:Platform=x64 "-p:Configuration=$env:CONFIG" `
              "-p:TreatWarningAsError=false"
          if ($LASTEXITCODE -ne 0) { throw "gui-agent build failed" }

      - name: Build wgcbroker
        shell: pwsh
        run: |
          # tools/wgcbroker: user-session Windows.Graphics.Capture broker for the gui-agent
          # (Win11 24H2+ occluded-window capture). Plain v143, /MT, C++/WinRT from the SDK,
          # no WDK/nuget - mirrors tools/wgcprobe.
          & "${{ steps.vs.outputs.msbuild }}" tools\wgcbroker\wgcbroker.vcxproj `
              /p:Configuration=Release /p:Platform=x64 /t:Build
          if ($LASTEXITCODE -ne 0) { throw "wgcbroker msbuild failed" }
          Get-ChildItem tools\wgcbroker\x64\Release\wgcbroker.exe

      # core-agent-windows (our fork) carries the qrexec-wrapper drain-race fix (U15). It needs the
      # SAME dependency set the gui-agent build just staged - libvchan, xencontrol, windows-utils,
      # qubesdb-client - so it is built here rather than in a job that would have to stage them all
      # again. Non-fatal on purpose: a break in this build must not take down the gui-agent
      # deliverable, but it MUST be visible, so the failure is annotated rather than swallowed.
      - name: Build core-agent (qrexec) fork
        id: coreagent
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $ws  = "${{ github.workspace }}"
          $env:QB_SCRIPTS = "$ws\deps-src\builderv2\qubesbuilder\plugins\build_windows\scripts"
          # Build the qrexec projects ONLY, not the whole solution. `relocate-dir` in that solution
          # includes ntifs.h, a WDK header this runner does not have, and it failed the whole
          # solution build while every qrexec binary we actually want had already compiled. Nothing
          # here needs the WDK, so target the projects directly and keep the WDK out of this job.
          # qwt_version.h is GENERATED, and only qrexec-agent.vcxproj's PreBuild event generates it
          # (`set-version.ps1 <version> <qwt_version.h>`). Building a single project therefore fails
          # with RC1015 "cannot open include file '..\qwt_version.h'" whenever that project is not
          # qrexec-agent. Generate it up front so build ORDER cannot decide whether the build works.
          & powershell "$env:QB_SCRIPTS\set-version.ps1" "$ws\core-agent\version" "$ws\core-agent\qwt_version.h"
          if (-not (Test-Path "$ws\core-agent\qwt_version.h")) { throw "failed to generate qwt_version.h" }
          Write-Host "generated qwt_version.h: $(Get-Content "$ws\core-agent\qwt_version.h" | Select-Object -First 3)"

          $projects = @('qrexec-wrapper','qrexec-agent','qrexec-client-vm')
          foreach ($p in $projects) {
            $proj = "$ws\core-agent\vs2022\$p\$p.vcxproj"
            if (-not (Test-Path $proj)) { throw "core-agent project not found: $proj" }
            & "${{ steps.vs.outputs.msbuild }}" $proj `
                -nologo -m -v:minimal -p:Platform=x64 "-p:Configuration=$env:CONFIG" `
                "-p:TreatWarningAsError=false"
            if ($LASTEXITCODE -ne 0) { throw "core-agent: $p build failed ($LASTEXITCODE)" }
          }

      - name: Flag core-agent build result
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ('${{ steps.coreagent.outcome }}' -eq 'success') {
            Write-Host '::notice title=core-agent::fork built OK'
          } else {
            Write-Host '::warning title=core-agent::fork FAILED to build - the U15 qrexec-wrapper fix is NOT in this package'
          }

      - name: Collect package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = $env:CONFIG
          $out = "agent\vs2022\x64\$cfg"
          New-Item -ItemType Directory -Force package-agent | Out-Null
          # the fork's qrexec binaries, when it built
          $caOut = "core-agent\vs2022\x64\$cfg"
          foreach ($p in 'qrexec-agent','qrexec-wrapper','qrexec-client-vm') {
            if (Test-Path "$caOut\$p\$p.exe") {
              Copy-Item "$caOut\$p\$p.exe" package-agent\ -Force
              if (Test-Path "$caOut\$p\$p.pdb") { Copy-Item "$caOut\$p\$p.pdb" package-agent\ -Force }
            } else { Write-Warning "core-agent: $p.exe not produced" }
          }
          foreach ($p in 'gui-agent','gui-watchdog','dump-windows') {
            if (Test-Path "$out\$p\$p.exe") { Copy-Item "$out\$p\$p.exe" package-agent\ -Force }
            if (Test-Path "$out\$p\$p.pdb") { Copy-Item "$out\$p\$p.pdb" package-agent\ -Force }
          }
          if (Test-Path tools\grantprobe\x64\Release\grantprobe.exe) {
            Copy-Item tools\grantprobe\x64\Release\grantprobe.exe package-agent\ -Force
          } else { Write-Warning 'grantprobe.exe missing from package-agent' }
          if (Test-Path tools\wgcbroker\x64\Release\wgcbroker.exe) {
            Copy-Item tools\wgcbroker\x64\Release\wgcbroker.exe package-agent\ -Force
          } else { Write-Warning 'wgcbroker.exe missing from package-agent' }
          Get-ChildItem package-agent

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gui-agent-package
          path: package-agent/
          retention-days: 14

  # ------------------------------------------------- Deliverable: installable QWT overlay
  # Produces ONE downloadable artifact ('qwt-improved-package') that a user unpacks in a
  # Windows qube and installs with install-qwt-improved.ps1. It is an overlay updater for
  # an existing QWT 4.2.2 install (GUI agent only) — see ci-notes/packaging.md for why a
  # full patched-MSI / rebuilt-QWT package is not the deliverable.
  package:
    needs: [gui-agent, idd-driver]
    # Build the package whenever the agent built, even if the driver job failed.
    if: ${{ always() && needs.gui-agent.result == 'success' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0        # so `git describe` in the agent submodule resolves tags

      - name: Download gui-agent artifact
        uses: actions/download-artifact@v4
        with:
          name: gui-agent-package
          path: dl/gui-agent

      - name: Download idd-driver artifact (best effort)
        id: dl_driver
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: idd-driver-package
          path: dl/idd-driver

      # actions/checkout marks the workspace safe inside a TEMPORARY HOME and then restores
      # HOME, so by this point git reports "detected dubious ownership" and every provenance
      # lookup in make-package.ps1 fails -> agent_commit/driver_repo_commit = 'unknown'.
      - name: Mark workspace safe for git
        shell: pwsh
        run: |
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE/agent"
          $repoSha  = (git -C "$env:GITHUB_WORKSPACE" rev-parse HEAD).Trim()
          $agentSha = (git -C "$env:GITHUB_WORKSPACE/agent" rev-parse HEAD).Trim()
          $agentDesc = (git -C "$env:GITHUB_WORKSPACE/agent" describe --always --dirty --tags 2>$null)
          if (-not $agentDesc) { $agentDesc = $agentSha }
          if (-not $repoSha -or -not $agentSha) { throw 'could not resolve provenance SHAs' }
          Write-Host "repo=$repoSha agent=$agentSha desc=$agentDesc"
          # Hand them to make-package.ps1 explicitly. Resolving git from inside that script
          # kept yielding 'unknown' on the runner even though it works here, so stop relying
          # on it: pass what we already know, and fail loudly above if it is unavailable.
          "QWT_REPO_SHA=$repoSha"       | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "QWT_AGENT_SHA=$agentSha"     | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "QWT_AGENT_DESCRIBE=$($agentDesc.Trim())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Assemble package
        shell: pwsh
        run: |
          # HASHTABLE, not array: splatting an array passes the elements POSITIONALLY, so
          # '-AgentArtifact' itself would bind to $AgentArtifact, 'dl/gui-agent' to
          # $DriverArtifact, and the next switch has no slot left -> "A positional parameter
          # cannot be found that accepts argument '-DriverArtifact'". Named splatting needs
          # a hashtable.
          $mkArgs = @{ AgentArtifact = 'dl/gui-agent'; OutDir = 'package-qwt' }
          if ('${{ steps.dl_driver.outcome }}' -eq 'success') {
            $mkArgs.DriverArtifact = 'dl/idd-driver'
          } else {
            Write-Warning 'idd-driver artifact unavailable; packaging without optional/idd-driver'
          }
          & .\packaging\make-package.ps1 @mkArgs

      # Optional and OFF unless the repo variable is set. Signs the two installable
      # binaries with the throwaway test cert the driver job already uses, so
      # Get-AuthenticodeSignature reports a known publisher instead of NotSigned.
      # Signing rewrites the .exe, which invalidates the hashes the previous step already
      # baked into MANIFEST.json / SHA256SUMS.txt — so this step re-runs the assembler
      # afterwards to regenerate them over the signed binaries.
      - name: Test-sign installable binaries (optional)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASS }}
        run: |
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object FullName -match 'x64' | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          Get-ChildItem dl\gui-agent -Filter *.exe | ForEach-Object {
              & $signtool.FullName sign /fd sha256 /f cert.pfx /p $env:PFX_PASS $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($_.Name)" }
          }
          Remove-Item cert.pfx
          # re-stage so MANIFEST.json / SHA256SUMS.txt describe the SIGNED files
          $mkArgs = @{ AgentArtifact = 'dl/gui-agent'; OutDir = 'package-qwt' }
          if ('${{ steps.dl_driver.outcome }}' -eq 'success') { $mkArgs.DriverArtifact = 'dl/idd-driver' }
          & .\packaging\make-package.ps1 @mkArgs

      - name: Show manifest
        shell: pwsh
        run: Get-Content package-qwt\MANIFEST.json

      - uses: actions/upload-artifact@v4
        with:
          name: qwt-improved-package
          path: package-qwt/
          retention-days: 14
