# Build xenvif from upstream master, because the pair Qubes pins CANNOT WORK.
#
# MEASURED 2026-08-07, from the pinned sources themselves (no build needed to establish it):
#   xenvif @ 9fd1afe4 (pinned by qubes-vmm-xen-windows-pvdrivers, on main == release4.3 ==
#                      v4.2.0-1 - all three pin the SAME submodules)
#       include/revision.h tops out at   DEFINE_REVISION(0x09000004, ...)
#   xennet @ ad7717f6 (pinned by the same repo)
#       requires                          XENVIF\VEN_XP0001&DEV_NET&REV_09000005
#
# No hardware ID intersects, so the XENVIF NET child never binds: it sits at code 28
# (CM_PROB_FAILED_INSTALL) and Windows falls back to the QEMU-emulated Realtek NIC. The
# PV network path is dead on every Qubes 4.3 Windows guest built from those pins, stock
# included - our MSI's PV binaries are byte-identical to stock's (3-file diff, all ours).
#
# rev 5 exists upstream: xenvif commit 4608bc1 "Use UNPLUG v3" added
#   DEFINE_REVISION(0x09000005, 2, 10, 2, 1, 3)
# and master (94853a0, 2026-07-29) carries it while still defining 09000001..09000004, so
# it satisfies xennet's requirement without dropping backwards compatibility. Our pin is
# 54 commits behind that.
#
# This job builds xenvif at a PINNED master SHA (never a moving ref - a build whose inputs
# can change is not evidence) and test-signs it with the same throwaway cert as the rest of
# our binaries. The guest already runs with testsigning on, which the installer enables.
name: pv-xenvif

on:
  workflow_call:
    inputs:
      diagnostic:
        description: 'Build with the enable-path xenstore diagnostic (never for release)'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Build with the enable-path xenstore diagnostic (never for release)'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - '.github/workflows/pv-xenvif.yml'
      - 'patches/xenvif-enable-diag.patch'

env:
  # /Brepro: content-hash PE TimeDateStamp so the same commit yields the same binary.
  # Without it gui-agent.exe differed across runs at one commit (CBBD0206.. vs BDA4615A..).
  LINK: /Brepro
  # UNPINNED (user, 2026-08-07: "unpin and upgrade xenvif"). Track master so we always get
  # the newest interface revisions; the resolved SHA is echoed and written into
  # PROVENANCE.txt so a given artifact is still traceable to an exact commit.
  # The rev-5 assertion below is what actually protects us - a master that ever lost
  # 0x09000005 fails the build instead of shipping a driver that cannot bind.
  XENVIF_REF: master

jobs:
  xenvif:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      # Copied VERBATIM from build.yml's proven idd-driver step. My paraphrase failed:
      # it looked for VSIXInstaller.exe under ProgramFiles(x86)\...\Installer (it lives
      # under ProgramFiles\Microsoft Visual Studio\2022) and set ErrorActionPreference=Stop,
      # which turns choco's non-fatal output into a failure.
      # This job builds an UPSTREAM tree, so it never needed our repo before. The opt-in
      # diagnostic patch lives here, so it does now - and the checkout must land in a
      # subdirectory, or it would collide with the xenvif clone in the workspace root.
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Install WDK + VS driver targets
        timeout-minutes: 15
        shell: pwsh
        run: |
          choco install windowsdriverkit11 --no-progress -y
          $vsix = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix" -Recurse -Filter '*.vsix' |
                  Select-Object -First 1
          if (-not $vsix) { throw "WDK.vsix not found after choco install" }
          $inst = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Recurse -Filter VSIXInstaller.exe |
                  Select-Object -First 1
          Start-Process $inst.FullName -ArgumentList '/quiet', $vsix.FullName -Wait

      - name: Fetch xenvif at the pinned SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --quiet --branch $env:XENVIF_REF https://xenbits.xen.org/git-http/pvdrivers/win/xenvif.git xenvif
          if ($LASTEXITCODE -ne 0) { throw "clone of $env:XENVIF_REF failed" }
          $sha = (git -C xenvif rev-parse HEAD).Trim()
          Write-Host "xenvif $env:XENVIF_REF resolved to $sha"
          "XENVIF_RESOLVED=$sha" | Out-File -Append $env:GITHUB_ENV
          # ASSERT the reason this build exists. If a future SHA bump loses rev 5 the job
          # must fail here, not ship a driver that still cannot bind.
          $rev = Get-Content xenvif\include\revision.h -Raw
          if ($rev -notmatch '0x09000005') {
              throw "xenvif @ $sha does NOT define revision 0x09000005 - it cannot satisfy xennet"
          }
          Write-Host "confirmed: xenvif $sha defines 0x09000005"

      # DIAGNOSTIC BUILD, opt-in. On a Qubes host xenvif's Error() output is unreachable:
      # it goes to DbgPrint -> xen.sys -> __outbytestring to port 0xE9 or 0x12, and neither
      # is wired to anything readable (xl dmesg AND the stubdom log are both empty - measured
      # 2026-08-21). This patch republishes the outcome of every FrontendEnable step, plus the
      # RX-ring fill shortfall, into the FRONTEND's own xenstore directory, which the guest
      # reads back through the xeniface XenStore WMI interface. That is the only instrument
      # that can attribute the MiniportRestart failure seen against a mirage netback.
      #
      # OFF by default and never part of a release: run this workflow with
      # `-f diagnostic=true` to get it.
      - name: Apply the enable-path diagnostic patch (opt-in)
        if: inputs.diagnostic == true || inputs.diagnostic == 'true'
        shell: pwsh
        working-directory: xenvif
        run: |
          $ErrorActionPreference = 'Stop'
          git apply --verbose ..\repo\patches\xenvif-enable-diag.patch
          if ($LASTEXITCODE -ne 0) { throw "diagnostic patch did not apply" }
          # A patch that silently no-ops would produce a driver that looks instrumented and
          # is not - assert the markers are actually in the source before building.
          foreach ($m in @('qwt-enable-diag','qwt-rx-fill','FrontendEnableDiag')) {
            $hit = Select-String -Path src\xenvif\frontend.c, src\xenvif\receiver.c -Pattern $m -Quiet
            if (-not $hit) { throw "diagnostic marker '$m' missing after patch" }
          }
          Write-Host "::notice title=xenvif::DIAGNOSTIC build - publishes qwt-enable-diag / qwt-rx-fill to xenstore"

      - name: Build xenvif via its own build.ps1
        shell: pwsh
        working-directory: xenvif
        run: |
          # Use UPSTREAM'S OWN build script, not a bare msbuild call. msbuild alone fails
          # with C2065 on MAJOR_VERSION/MINOR_VERSION/MICRO_VERSION/BUILD_NUMBER/
          # VENDOR_NAME_STR: build.ps1 -> msbuild.ps1 derives those from the repo's
          # `version` file and passes them as preprocessor defines. Reproducing that by
          # hand would be another guess; the project already does it correctly.
          # -Type free = release build. SignMode TestSign is the default and matches our
          # test-signed guest.
          # msbuild.ps1 invokes bare `msbuild.exe`, which is NOT on PATH on the runner
          # (the previous failure: "The term 'msbuild.exe' is not recognized"). Put the VS
          # MSBuild directory on PATH rather than editing upstream's script.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $mb = & $vswhere -latest -requires Microsoft.Component.MSBuild `
                  -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $mb) { throw "MSBuild.exe not found" }
          $env:PATH = (Split-Path $mb) + ';' + $env:PATH
          Write-Host "msbuild on PATH: $mb"
          $env:VisualStudioVersion = '17.0'
          # build.ps1 derives DriverVer from BUILD_NUMBER, which defaults to 0 on a fresh
          # clone - so every build produced DriverVer 9.1.0.0 and a byte-identical INF.
          # pnputil dedupes on that: it reports "Driver package added successfully (Already
          # exists in the system)" with rc=0 and SILENTLY KEEPS THE OLD .sys. Measured - the
          # driver store still held the previous build and the fix under test never ran.
          # A release build keeps 0, so the same commit still yields the same binary; a
          # DIAGNOSTIC build takes the run number, so each one is a distinct, higher version
          # that Windows will actually install over its predecessor.
          if ('${{ inputs.diagnostic }}' -eq 'true') {
            $env:BUILD_NUMBER = '${{ github.run_number }}'
            Write-Host "::notice title=xenvif::diagnostic build - DriverVer 9.1.0.$env:BUILD_NUMBER"
          } else {
            $env:BUILD_NUMBER = '0'
          }
          .\build.ps1 -Type free -Arch x64
          if ($LASTEXITCODE -ne 0) { throw "xenvif build.ps1 failed" }
          Get-ChildItem . -Recurse -Include xenvif.sys,xenvif.inf,xenvif.cat |
            ForEach-Object { Write-Host "built: $($_.FullName)" }

      - name: Test-sign and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force pv-out | Out-Null
          $files = Get-ChildItem xenvif -Recurse -Include xenvif.sys,xenvif.inf,xenvif_coinst*.dll
          if (-not $files) { throw "no xenvif build outputs found" }
          $files | ForEach-Object { Copy-Item $_.FullName pv-out -Force }
          # Same throwaway test cert the rest of our binaries use; the installer turns
          # testsigning on, so the guest will load it.
          $cert = New-SelfSignedCertificate -Subject 'CN=QubesIDD Test Signing' -Type CodeSigningCert `
                    -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(2)
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter Inf2Cat.exe |
                     Select-Object -First 1
          & $inf2cat.FullName /driver:pv-out /os:10_x64
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed" }
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          Get-ChildItem pv-out -Include *.sys,*.cat -Recurse | ForEach-Object {
              & $st.FullName sign /fd SHA256 /a /s My /n 'QubesIDD Test Signing' $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($_.Name)" }
          }
          $prov = @(
            "xenvif built from xenbits $env:XENVIF_REF @ $env:XENVIF_RESOLVED",
            "reason: the xenvif/xennet pair pinned by qubes-vmm-xen-windows-pvdrivers cannot bind -",
            "        pinned xenvif tops out at REV_09000004, pinned xennet requires REV_09000005.",
            "        rev 5 was added by xenvif commit 4608bc1 (Use UNPLUG v3).",
            "signing: throwaway test cert (guest runs with testsigning enabled by our installer)"
          )
          # EXPORT THE SIGNING CERT. Without it the guest cannot trust this driver: the
          # workflow mints a FRESH self-signed cert each run, so the guest has never seen
          # it, and pnputil fails with 0xE0000247 (driver store add failed) even with
          # testsigning on - testsigning allows self-signed drivers but the publisher must
          # still be in Root/TrustedPublisher. Measured 2026-08-07.
          Export-Certificate -Cert $cert -FilePath pv-out\xenvif-signer.cer -Type CERT | Out-Null
          Set-Content pv-out\PROVENANCE.txt -Value $prov
          Get-ChildItem pv-out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: pv-xenvif
          path: pv-out/
