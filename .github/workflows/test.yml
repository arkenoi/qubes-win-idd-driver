# test: the gate that did not exist.
#
# Until now NOTHING executed a user-facing switch or a guest script in CI, which is how a fixed
# install.cmd shipped broken through three releases (GWeck forum 35 and 64: `C:\idd`, `D:\idd`),
# how a relay change silently started refusing HEAD replies, and how a PowerShell syntax error could
# only be found by pushing to a guest.
#
# Everything here runs on a plain Windows runner with no Qubes, no guest and no network:
#   1. the relay's own --selftest (response framing + the pid-lookup race)
#   2. install.cmd switch parsing, via the QWT_ELEVATE_DRYRUN hook the script already carries
#   3. a PowerShell PARSE of every shipped script
#   4. invariants that are cheap to assert and expensive to get wrong
name: test

on:
  push:
    branches: [main]
    paths:
      - 'guest/**'
      - 'packaging/**'
      - 'tools/**'
      - 'rpc/**'
      - 'core-agent/**'
      # mgmt/ WAS MISSING, and 85 of the 196 suites run by tools/tests/run-offline-suites.sh assert
      # against mgmt/ - campaign-preflight-selftest, matrix-runinstall-grade-selftest and the rest
      # of the harness suites among them. So a commit touching only mgmt/harness ran NONE of the
      # tests that cover it. MEASURED 2026-10-25: commit 669576d6 changed mgmt/harness/matrix.sh,
      # test.yml did not fire at all, ci-state INHERITED the previous sha's pass and reported "CI
      # GREEN for 669576d6e546" - and the change had in fact broken
      # matrix-runinstall-grade-selftest with an unbound $HERE. It surfaced one commit later only
      # because that commit happened to touch tools/, which IS in this list.
      - 'mgmt/**'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    steps:
      # submodules: the .ps1 checkers walk the whole tree, and without the submodules CI examines
      # 243 files where a local run sees 543 - so "local and CI cannot drift apart" would have been
      # false by 300 files. Every SHIPPED guest script lives in the superproject, so this widens
      # coverage rather than fixing a hole, but a checker whose scope silently differs from the one
      # developers run is how a gap goes unnoticed.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # ---------------------------------------------------------------- 1. relay selftest
      # The relay compiles with the in-box C# compiler exactly as it does on a guest, so CI builds
      # it the same way rather than a different way that might pass for the wrong reason.
      - name: Relay - compile with in-box csc and run --selftest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Get-ChildItem 'C:\Windows\Microsoft.NET\Framework64\v4.0.*\csc.exe' -EA SilentlyContinue | Select-Object -First 1
          if (-not $csc) { throw 'no in-box csc.exe on the runner' }
          New-Item -ItemType Directory -Force out | Out-Null
          & $csc.FullName /nologo /o /target:exe /out:out\relay.exe guest\qubes-updates-relay.cs
          if ($LASTEXITCODE -ne 0) { throw "relay compile failed ($LASTEXITCODE)" }
          $output = & .\out\relay.exe --selftest 2>&1
          $output | ForEach-Object { Write-Host $_ }
          $pass = @($output | Select-String '^PASS ').Count
          $fail = @($output | Select-String '^FAIL ').Count
          Write-Host "::notice title=relay selftest::$pass passed, $fail failed"
          if ($LASTEXITCODE -ne 0 -or $fail -gt 0) { throw "relay selftest FAILED ($fail)" }
          if ($pass -lt 10) { throw "selftest reported only $pass assertions - it has been gutted, not passed" }

      # ---------------------------------------------------------------- 2. install.cmd switches
      # THE regression that shipped three times: bare `shift` in the parse loop overwrites %0, so
      # %~f0 later resolves to `C:\<switch>` and the elevated relaunch is handed a path that does not
      # exist. QWT_ELEVATE_DRYRUN makes install.cmd PRINT what it would relaunch instead of doing it,
      # which is testable without UAC, without elevation and without a guest.
      - name: install.cmd - the elevated relaunch must target the SCRIPT, not a switch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path 'packaging\setup\install.cmd').Path
          $env:QWT_ELEVATE_DRYRUN = '1'
          $bad = 0
          foreach ($sw in @('', '/idd', '/noidd', '/auto', '/iddonly', '/iddoff', '/updatesonly', '/nonet', '/reboot')) {
            $out = & cmd /c "`"$script`" $sw" 2>&1 | Out-String
            if ($out -notmatch 'ELEVATE-FILEPATH=\[(.+?)\]') { Write-Host "::error::no ELEVATE-FILEPATH for '$sw'"; $bad++; continue }
            $target = $Matches[1]
            if ($target -ne $script) {
              Write-Host "::error title=install.cmd::switch '$sw' would relaunch [$target] instead of the script"
              $bad++
            } else {
              Write-Host ("  OK  '{0,-12}' -> {1}" -f $sw, $target)
            }
          }
          if ($bad) { throw "$bad switch(es) resolve the wrong relaunch target" }
          # The GH pwsh wrapper exits with the trailing $LASTEXITCODE, which here is still the exit
          # code of the last `cmd /c` - so a step that PASSED can fail on a non-zero install.cmd rc.
          exit 0

      - name: install.cmd - an unknown switch must be refused, not ignored
        shell: pwsh
        run: |
          $script = (Resolve-Path 'packaging\setup\install.cmd').Path
          $env:QWT_ELEVATE_DRYRUN = '1'
          & cmd /c "`"$script`" /definitely-not-a-switch" | Out-Null
          $rc = $LASTEXITCODE
          if ($rc -eq 0) { throw "unknown switch was accepted (exit 0) - it must fail" }
          Write-Host "  OK  unknown switch rejected with exit $rc"
          exit 0   # the non-zero rc above is the PASS condition; do not leak it as the step's status

      # ---------------------------------------------------------------- 3. PowerShell parse
      # This step used to inline its own parse loop over guest/ + packaging/ only. It now calls the
      # same checker the pre-commit hook runs, so local and CI cannot drift apart, and it covers the
      # whole repo (tools/, rpc/, mgmt/ were never parsed by anything before).
      - name: PowerShell - parse every shipped script
        shell: pwsh
        run: pwsh -NoProfile -File tools/ps-parse-check.ps1

      # PARSING WITH PowerShell 7 IS A FALSE PASS ON ITS OWN, and the step above has always done
      # exactly that (shell: pwsh). 7 ACCEPTS SYNTAX 5.1 REJECTS - a ternary, ??, ??=, a && / ||
      # pipeline chain - and the guests run Windows PowerShell 5.1: every invocation in this repo is
      # `powershell`/`powershell.exe`, never pwsh. So a script using any of those parses green here
      # and is a SYNTAX ERROR where it actually runs. PSUseCompatibleSyntax knows each version's
      # grammar instead of inferring it from whichever parser happens to be present.
      - name: PowerShell - syntax must be valid in Windows PowerShell 5.1, not just 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AcceptLicense
          }
          # The checker exits 2 when the analyzer is unavailable - "did not run", never a pass.
          pwsh -NoProfile -File tools/ps-compat-check.ps1
          if ($LASTEXITCODE -ne 0) { throw "5.1 compatibility check failed (exit $LASTEXITCODE)" }

      # ---------------------------------------------------------------- 4. cheap invariants
      - name: Invariants that are expensive to get wrong
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          function Check($name, $cond, $why) {
            if ($cond) { Write-Host "  OK  $name" } else { Write-Host "::error title=$name::$why"; $script:bad++ }
          }

          # -Scheduled marks the AUTOMATIC pass, the only one the debounce may skip. If it ever
          # appears on the Run or Download task, a pass dom0 asked for could be silently dropped.
          $agent = Get-Content guest\install-updater-agent.ps1 -Raw
          Check 'scan task carries -Scheduled' ($agent -match '-Action scan -Scheduled') `
                'the scheduled scan must be marked -Scheduled or the debounce is inert'
          Check 'Run/Download tasks do NOT carry -Scheduled' `
                (-not ($agent -match '-Action (full|download)[^\r\n]*-Scheduled')) `
                'a dom0-driven pass must never be skippable by the debounce'

          # The updater must never hand Windows a body it knows is short.
          $relay = Get-Content guest\qubes-updates-relay.cs -Raw
          Check 'relay refuses incomplete responses' ($relay -match 'PLAIN REFUSED') `
                'the honesty gate is missing - a short body could be served as a 200'
          Check 'relay spills instead of truncating' ($relay -match 'Spill point') `
                'MaxVerifyBytes must spill to the client, never cut the body'

          # Priming must be staged into the package, or app qubes built from a template inherit an
          # unprimed root and loop on the PV NIC driver install.
          $mk = Get-Content packaging\make-setup.ps1 -Raw
          Check 'pvnic-selfprime.ps1 is staged' ($mk -match 'pvnic-selfprime\.ps1') `
                'without it the installer cannot seed PV NIC priming'

          if ($bad) { throw "$bad invariant(s) violated" }

  offline-suites:
    # SELFTESTSUNRUNINCI: tools/tests/ holds 117 *-selftest.sh files and this workflow named them
    # only inside comments ("Proven offline by tools/tests/svc-exitcode-selftest.sh" and five more
    # of that shape). So a green `test` said nothing about any of them, and every offline receipt in
    # findings/issues.md - the windows-utils patch suites, the gate suites, the harness libraries -
    # held only as long as someone kept running them by hand on the dev qube.
    #
    # The list is curated and MEASURED: candidates are excluded statically when they need a Qubes
    # rig, a loop device, PowerShell, mtools or a compiler, and what remained was run and observed
    # to pass. tools/tests/offline-suites.txt carries the list, the method and the four suites that
    # are RED at this sha with their reasons, so a suite can never be dropped from CI in silence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # TAGS, NOT JUST THE TIP. gate-remainder.sh resolves its range with
          # `git describe --tags --match 'v4.3.*'` and REFUSES with exit 2 when there is none, so on
          # the default shallow checkout gate-remainder-dry-selftest read "the dry run exited 2" and
          # three of its legs failed in CI while passing on the dev qube.
          fetch-depth: 0
      # THE VENDORED MIRROR HAS TO BE MATERIALISED, and until now only a comment said so. upstream/ro
      # is GITIGNORED (.gitignore:27), so a clean checkout has never carried it, and the two suites
      # that read upstream/ro/qubes-windows-utils/src/log.c reported INCONCLUSIVE (rc=2) - which this
      # runner counts RED. The estate was therefore red in CI on every run, while being green on the
      # dev qube, and "CI is not green" is what campaign-preflight refuses a release campaign on.
      # Pinned to the same commit the dev qube holds (mm_22e03f5a) rather than a branch: a moving
      # upstream would change what these suites measure without a commit here saying so.
      - name: Vendored read-only upstream (pinned) - the suites that read it are not skippable
        env:
          # THE FULL 40-CHAR SHA. `git fetch origin 22e03f5a` died with "couldn't find remote ref" -
          # a fetch by object name needs the whole sha, and a short one is read as a ref name.
          # The commit is on origin/main of the public mirror, so the shallow fetch below reaches it.
          WINDOWS_UTILS_SHA: 22e03f5a55d707c83bf8e5b909785472a7424021
        run: |
          set -euo pipefail
          mkdir -p upstream/ro
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/QubesOS/qubes-windows-utils.git upstream/ro/qubes-windows-utils
          git -C upstream/ro/qubes-windows-utils fetch --quiet --depth 1 origin "$WINDOWS_UTILS_SHA"
          git -C upstream/ro/qubes-windows-utils checkout --quiet FETCH_HEAD
          test "$(git -C upstream/ro/qubes-windows-utils rev-parse HEAD)" = "$WINDOWS_UTILS_SHA"
          test -f upstream/ro/qubes-windows-utils/src/log.c
          test -f upstream/ro/qubes-windows-utils/include/log.h
          echo "windows-utils at $(git -C upstream/ro/qubes-windows-utils rev-parse --short HEAD)"
      # lxml, FOR THE SAME REASON AS THE VENDORED MIRROR ABOVE: a suite that cannot reach what it
      # measures reports rc=2 - "nothing ran (missing data fails)" - and this runner counts that
      # RED. death-reporter-xpath-selftest.py evaluates the shipped Event Log XPath queries with a
      # real XPath engine instead of a model of them, so lxml is what it measures WITH. Measured:
      # CI run 40192417696, "FAIL death-reporter-xpath-selftest.py rc=2 lxml is not installed".
      # The fix is the dependency, never dropping the suite from the list - an excluded suite rots,
      # and the exclusion is the cause.
      - name: lxml - the XPath suite evaluates real queries, not a model of them
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check lxml
          python3 -c 'from lxml import etree; print("lxml", etree.__version__)'
      - name: Offline selftest suites (serial, with a floor)
        run: tools/tests/run-offline-suites.sh
      # PROBE, NOT A GATE. blockclaim-selftest.sh is the one suite kept out of the list for a
      # DEPENDENCY rather than a defect: it drives a real loop device through the root-free route
      # (`udisksctl loop-setup`, because sudo on the dev qube is interactive-only by design), and
      # whether that route works on a GitHub runner - udisks2 absent by default, and a runner
      # session that may not be polkit-active - cannot be measured from the dev qube. Its 1-in-5
      # race was fixed on 2026-10-26 and 13/13 pass there; this step is the missing MEASUREMENT.
      # continue-on-error because it decides a registration, it does not guard anything yet: the
      # suite is NOT in offline-suites.txt, so a red probe must not fail this workflow. Read its
      # result, then either register the suite (floor +1, in a commit) or record here that the
      # route is unavailable on this runner. Delete this step once that decision is made.
      - name: PROBE udisks2 - decides whether blockclaim-selftest can join the gate
        continue-on-error: true
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq udisks2 || echo "PROBE: udisks2 would not install"
          systemctl is-active udisks2 || echo "PROBE: udisks2.service is not active"
          udisksctl status || echo "PROBE: udisksctl status failed"
          bash tools/tests/blockclaim-selftest.sh; echo "PROBE: blockclaim-selftest rc=$?"

  bind-dirs-offline:
    # The bind-dirs core (core-agent/src/bind-dirs/bind-dirs.c, docs/BIND-DIRS.md) is portable C
    # built with gcc against an in-memory fake FS: config grammar, path refusals, the
    # seed/junction state machine with failure injection. failproof.sh then re-introduces eight
    # defects one at a time and requires the suite to go red for each - a suite that has not been
    # seen to fail is not evidence (CLAUDE.md). Linux runner: this is the one job here that needs
    # gcc, not MSVC, and the core must stay buildable on both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: bind-dirs core - offline tests
        run: tools/tests/bind-dirs/run.sh
      - name: bind-dirs core - the suite must fail on re-introduced defects
        run: tools/tests/bind-dirs/failproof.sh
